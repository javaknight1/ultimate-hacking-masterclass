ok'>'\\certutil.exe'</span>\n    CommandLine|contains:\n      - <span class='ok'>'-urlcache'</span>\n      - <span class='ok'>'-split'</span>\n      - <span class='ok'>'urlcache'</span>\n  <span class='cm'>condition</span>: selection\n<span class='cm'>falsepositives</span>:\n  - <span class='dim'>Legitimate certificate management</span>\n<span class='cm'>level</span>: high\n<span class='cm'>tags</span>:\n  - attack.command_and_control\n  - attack.t1105</div></div><h3>Compiling to a backend</h3><p>The same YAML becomes a runnable query in seconds. Install pySigma and convert.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>sigma -> Elastic & Splunk</span></div><div class='term-body'><span class='pr'>$</span> pip install sigma-cli pysigma-backend-elasticsearch pysigma-backend-splunk\n<span class='pr'>$</span> sigma convert -t lucene -p ecs_windows certutil_download.yml\n<span class='ok'>winlog.event_data.Image:*\\\\certutil.exe AND\nwinlog.event_data.CommandLine:(*-urlcache* OR *-split* OR *urlcache*)</span>\n\n<span class='pr'>$</span> sigma convert -t splunk certutil_download.yml\n<span class='ok'>Image=\"*\\\\certutil.exe\" CommandLine IN (\"*-urlcache*\",\"*-split*\")</span></div></div><h3>Writing good selections</h3><p>The art is choosing fields that match the <em>behaviour</em>, not a brittle artifact. Match on the technique (a process downloading via a LOLBin) rather than a single hardcoded URL or filename the attacker trivially changes.</p><ul><li><strong>Be specific enough</strong> to avoid drowning analysts in false positives.</li><li><strong>Be general enough</strong> to survive cosmetic attacker changes (rename, re-encode, reorder args).</li><li>Use modifiers: <code>|endswith</code>, <code>|contains</code>, <code>|re</code> (regex), <code>|base64offset|contains</code> for encoded command lines.</li><li>Combine selections and a <code>filter</code> to carve out known-good noise: <code>condition: selection and not filter</code>.</li></ul><h4>Quality, not quantity</h4><p>Detection engineers measure rules by <strong>true-positive rate</strong> and <strong>false-positive burden</strong>, not by how many rules they ship. A rule that fires 400 times a day on benign admin activity will be muted within a week and miss the one real intrusion. Tune against a baseline of your own environment before promoting a rule to production.</p><div class='box tip'><div class='bt'>Tip.</div> Pair every detection with a short <em>test case</em>: a command or atomic that should trigger it. The Atomic Red Team project (<code>Invoke-AtomicTest</code>) provides ready-made, ATT&amp;CK-mapped tests so you can prove a rule fires before trusting it in production.</div><div class='box danger'><div class='bt'>Watch out.</div> Generic string matching on a command line can be evaded by whitespace, environment-variable expansion (<code>%CommSpec%</code>), or PowerShell tick-marks (<code>cert`util</code>). Anticipate obfuscation and normalize where you can.</div><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: write, compile, and validate your first Sigma rule end to end.</p><ol><li>Pick an attack from an earlier part &mdash; e.g. an encoded PowerShell command (<code>powershell -enc ...</code>).</li><li>Write a Sigma rule with logsource <code>process_creation</code> matching <code>powershell.exe</code> plus <code>-enc</code>/<code>-EncodedCommand</code>.</li><li>Convert it to your SIEM backend with <code>sigma convert</code>.</li><li>Run the malicious command in your lab VM, then confirm the compiled query returns it.</li><li>Now run a benign encoded command to test your false-positive rate, and add a <code>filter</code> if needed.</li></ol></div></div>"});
add({"id":"p19-3","part":"19 · Blue Team & Detection","nav":"EDR & Evasion","num":"19.3","kicker":"Part 19 · Lesson 3","title":"EDR Concepts & the Detection-vs-Evasion Arms Race","html":"<h3>What an EDR actually does</h3><p>A SIEM reasons over logs after the fact. An <strong>EDR</strong> (Endpoint Detection and Response) lives <em>on the host</em>, watching behaviour as it happens and able to act &mdash; kill a process, isolate the machine, roll back changes. Products like CrowdStrike Falcon, Microsoft Defender for Endpoint, SentinelOne and the open-source Wazuh + osquery combo all follow the same blueprint.</p><div class='box law'><div class='bt'>Definition.</div> An EDR sensor instruments the operating system to observe process, file, registry, and network activity, correlates those events into behavioural detections, streams telemetry to a cloud console, and exposes response actions for analysts.</div><h3>How sensors get visibility</h3><p>To see what code does, the sensor hooks the points where user code asks the kernel for power.</p><ul><li><strong>Userland API hooking</strong> &mdash; the EDR injects a DLL that patches the start of sensitive functions (e.g. <code>NtAllocateVirtualMemory</code>, <code>NtCreateThreadEx</code>) to inspect calls before forwarding them. Cheap, but tampered with from userland.</li><li><strong>Kernel callbacks</strong> &mdash; registered via <code>PsSetCreateProcessNotifyRoutine</code>, <code>ObRegisterCallbacks</code>, and image-load notifications. Harder to bypass from user mode.</li><li><strong>ETW (Event Tracing for Windows)</strong> &mdash; especially the <em>Threat Intelligence</em> provider, which surfaces in-memory operations like remote thread creation.</li><li><strong>AMSI</strong> &mdash; the Antimalware Scan Interface lets the sensor inspect scripts (PowerShell, JScript, VBA, .NET) <em>after</em> de-obfuscation, defeating simple encoding.</li></ul><h3>The arms race</h3><p>Because you now understand offense, you can predict the evasions. Each defensive mechanism above has a documented bypass, and each bypass has a counter-detection. This is the core dynamic of modern endpoint security.</p><table><tr><td><strong>Attacker technique</strong></td><td><strong>Defensive counter</strong></td></tr><tr><td>Unhooking / direct &amp; indirect syscalls to skip userland hooks</td><td>Kernel callbacks + ETW-Ti see the syscall regardless of userland state</td></tr><tr><td>AMSI patching (<code>AmsiScanBuffer</code> returns clean)</td><td>Detect the in-memory patch; ETW logs the .NET load; alert on the patch pattern</td></tr><tr><td>Process injection (hollowing, APC, thread hijack)</td><td>Remote-thread / cross-process write callbacks; memory-region scanning for RWX</td></tr><tr><td>Living-off-the-land (LOLBins: <code>rundll32</code>, <code>mshta</code>)</td><td>Behavioural rules on unusual parent-child and network from signed binaries</td></tr><tr><td>BYOVD &mdash; bring your own vulnerable driver to kill the sensor</td><td>Driver blocklist (HVCI), tamper-protection, alert on sensor service stop</td></tr></table><h3>Telemetry an evasion leaves behind</h3><p>The crucial blue-team insight: <em>evasion is not invisibility</em>. Patching AMSI requires writing to the memory of a protected DLL &mdash; that write is itself an anomaly. Unhooking restores original bytes over the EDL's DLL &mdash; the EDR can checksum its own hooks. The defender's job is to detect the <strong>act of evading</strong>, which is often louder than the original technique.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>hunting for RWX injection via Sysmon EID 8</span></div><div class='term-body'><span class='dim'># Sysmon EID 8 = CreateRemoteThread; EID 10 = ProcessAccess</span>\n<span class='pr'>$</span> sigma rule (concept):\n  selection:\n    EventID: 8\n    SourceImage|endswith: <span class='ok'>'\\powershell.exe'</span>\n    TargetImage|endswith: <span class='bad'>'\\explorer.exe'</span>\n  condition: selection\n<span class='dim'># PowerShell injecting a thread into explorer = textbook injection</span></div></div><div class='box tip'><div class='bt'>Tip.</div> EDR telemetry and SIEM telemetry are complementary, not redundant. EDR excels at in-memory and behavioural signals on the host; the SIEM correlates across hosts, identity, network, and cloud. Mature programs ship EDR data <em>into</em> the SIEM for cross-source correlation.</div><div class='box danger'><div class='bt'>Watch out.</div> Tamper protection is your last line. If an attacker with admin can stop the sensor service or unload its driver unchallenged, every detection above evaporates. Enable tamper protection, require a separate uninstall password, and alert centrally the instant a sensor goes silent.</div><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: observe the detection-vs-evasion loop safely in your own lab.</p><ol><li>On a Windows VM with Sysmon, run a benign script and watch AMSI/ETW telemetry appear.</li><li>Run a known, public AMSI-bypass snippet in the same VM (authorized lab only) and note what new artifacts appear &mdash; the memory write, the .NET assembly load.</li><li>Write a Sigma/EDR rule that targets the <em>bypass</em> rather than the payload.</li><li>Stop your logging agent and confirm a central alert fires on the agent going silent.</li><li>Re-enable tamper protection and document which evasions it now blocks.</li></ol></div></div>"});
add({"id":"p19-4","part":"19 · Blue Team & Detection","nav":"MITRE ATT&CK","num":"19.4","kicker":"Part 19 · Lesson 4","title":"Mapping Attacks to MITRE ATT&CK","html":"<h3>A shared language for adversary behaviour</h3><p>Detections are most useful when you can reason about <em>coverage</em>: which attacker behaviours can we see, and where are the gaps? <strong>MITRE ATT&amp;CK</strong> gives the whole industry a common, structured vocabulary for that conversation. It is a knowledge base of real-world adversary behaviour organized as a matrix.</p><div class='box law'><div class='bt'>Definition.</div> ATT&amp;CK organizes behaviour into <strong>Tactics</strong> (the adversary's goal &mdash; the <em>why</em>), <strong>Techniques</strong> (how they achieve it &mdash; the <em>what</em>, e.g. T1059 Command and Scripting Interpreter), <strong>Sub-techniques</strong> (a specific variant, e.g. T1059.001 PowerShell), and <strong>Procedures</strong> (the concrete observed implementation).</div><h3>The tactics, in order of an intrusion</h3><p>The columns of the Enterprise matrix roughly follow an attacker's journey &mdash; the same journey you walked offensively earlier in this course:</p><ol><li><strong>Reconnaissance</strong> &amp; <strong>Resource Development</strong> &mdash; pre-compromise.</li><li><strong>Initial Access</strong> (T1566 Phishing, T1190 Exploit Public-Facing App).</li><li><strong>Execution</strong> (T1059 scripting), <strong>Persistence</strong> (T1547 boot/logon autostart, T1053 scheduled task).</li><li><strong>Privilege Escalation</strong>, <strong>Defense Evasion</strong> (T1562 impair defenses, T1055 process injection).</li><li><strong>Credential Access</strong> (T1003 OS credential dumping), <strong>Discovery</strong>, <strong>Lateral Movement</strong> (T1021 remote services).</li><li><strong>Collection</strong>, <strong>Command and Control</strong> (T1071 app-layer protocol), <strong>Exfiltration</strong>, <strong>Impact</strong> (T1486 data encrypted for impact).</li></ol><h3>Mapping a real attack chain</h3><p>Take a ransomware-style intrusion and label each step. This is exactly how an incident report and a detection backlog get built.</p><table><tr><td><strong>Observed action</strong></td><td><strong>Tactic</strong></td><td><strong>Technique</strong></td></tr><tr><td>Macro-laden Office doc opened</td><td>Initial Access</td><td>T1566.001</td></tr><tr><td>Word spawns PowerShell</td><td>Execution</td><td>T1059.001</td></tr><tr><td>Scheduled task created</td><td>Persistence</td><td>T1053.005</td></tr><tr><td>LSASS memory read</td><td>Credential Access</td><td>T1003.001</td></tr><tr><td>PsExec to a file server</td><td>Lateral Movement</td><td>T1021.002</td></tr><tr><td>Beacon to HTTPS C2</td><td>Command and Control</td><td>T1071.001</td></tr></table><h3>Tagging detections and measuring coverage</h3><p>Every Sigma rule carries <code>tags: attack.tXXXX</code>. By collecting the technique IDs your rules cover, you can render a <strong>coverage heatmap</strong> over the matrix using the ATT&amp;CK Navigator &mdash; green where you have detection, red where you are blind. This turns a vague feeling of \"are we secure?\" into a concrete, prioritized gap list.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>extract ATT&CK coverage from a Sigma ruleset</span></div><div class='term-body'><span class='pr'>$</span> grep -rho <span class='ok'>'attack\\.t[0-9]\\{4\\}'</span> rules/ | sort -u\n<span class='ok'>attack.t1003</span>\n<span class='ok'>attack.t1053</span>\n<span class='ok'>attack.t1059</span>\n<span class='bad'># missing: t1021 lateral movement -> coverage gap</span>\n<span class='pr'>$</span> <span class='dim'># feed unique IDs into ATT&CK Navigator layer JSON to visualize</span></div></div><h3>Prioritize, don't boil the ocean</h3><p>ATT&amp;CK has hundreds of techniques; you cannot detect them all at once. Prioritize using <strong>threat intelligence</strong> (which techniques do the groups targeting your sector actually use?) and the <strong>MITRE ATT&amp;CK Top techniques calculator</strong>. Cover the high-frequency, high-impact behaviours &mdash; T1059, T1055, T1003, T1071 &mdash; before the exotic edge cases.</p><div class='box tip'><div class='bt'>Tip.</div> ATT&amp;CK is also a planning tool for the red team. <strong>Adversary emulation plans</strong> reproduce a named group's technique chain so the blue team can validate detection across the whole kill chain, not just one isolated alert. This is the bridge into purple teaming (Lesson 6).</div><div class='box law'><div class='bt'>Note.</div> ATT&amp;CK describes <em>behaviours</em>, which are durable, rather than indicators like IPs or hashes, which attackers rotate cheaply. Detecting at the technique level (the higher reaches of the \"Pyramid of Pain\") is far more painful for an adversary to evade.</div><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: build an ATT&amp;CK coverage heatmap for the detections you have written so far.</p><ol><li>List every detection rule in your lab and note its <code>attack.tXXXX</code> tag(s).</li><li>Open the MITRE ATT&amp;CK Navigator and create a new Enterprise layer.</li><li>Score each covered technique green; leave the rest uncolored.</li><li>Identify the three highest-priority gaps for your environment using threat-intel reasoning.</li><li>Write one new Sigma rule to close the top gap and re-render the layer.</li></ol></div></div>"});
add({"id":"p19-5","part":"19 · Blue Team & Detection","nav":"Incident Response","num":"19.5","kicker":"Part 19 · Lesson 5","title":"The Incident-Response Lifecycle","html":"<h3>From alert to recovery</h3><p>Detection is the beginning, not the end. When a rule fires and an analyst confirms it is real, the organization enters <strong>incident response</strong> (IR) &mdash; a disciplined process to contain the damage, evict the attacker, and restore normal operations while preserving evidence. The two canonical models are the <strong>NIST SP 800-61</strong> lifecycle and the <strong>SANS PICERL</strong> phases; they describe the same flow.</p><div class='box law'><div class='bt'>Definition.</div> The IR lifecycle: <strong>Preparation</strong> &rarr; <strong>Detection &amp; Analysis</strong> &rarr; <strong>Containment</strong> &rarr; <strong>Eradication</strong> &rarr; <strong>Recovery</strong> &rarr; <strong>Lessons Learned</strong>. It is a loop, not a line &mdash; every incident feeds back into preparation.</div><h3>1. Preparation</h3><p>The work you do <em>before</em> an incident determines how well you survive one. This means an IR plan with named roles and decision authority, an out-of-band communication channel (attackers read your email), pre-built playbooks, tested backups, a forensic toolkit, and retainer contacts for legal and external responders. The middle of an incident is the worst time to discover your backups never restored.</p><h3>2. Detection &amp; Analysis</h3><p>An analyst triages the alert: is it a true positive? What is the <strong>scope</strong> &mdash; one host or fifty? Build a <strong>timeline</strong> from your telemetry: first access, lateral movement, what was touched. Establish <strong>indicators of compromise (IOCs)</strong> &mdash; hashes, C2 domains, attacker accounts &mdash; and pivot on them across the SIEM to find every affected asset.</p><h3>3. Containment</h3><p>Stop the bleeding without tipping off the attacker prematurely or destroying evidence. <strong>Short-term containment</strong> isolates a host (EDR network-isolate, disable an account, block a C2 domain at the proxy). <strong>Long-term containment</strong> applies durable fixes while you prepare full eradication.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>containment actions</span></div><div class='term-body'><span class='dim'># isolate a host at the network layer (EDR console or manually)</span>\n<span class='pr'>PS&gt;</span> New-NetFirewallRule -DisplayName <span class='ok'>'IR-Isolate'</span> -Direction Outbound -Action Block -RemoteAddress Any\n\n<span class='dim'># disable a compromised AD account, force token revocation</span>\n<span class='pr'>PS&gt;</span> Disable-ADAccount -Identity <span class='bad'>jsmith</span>\n<span class='pr'>PS&gt;</span> Get-ADUser jsmith | Set-ADUser -Replace @{pwdLastSet=0}\n\n<span class='dim'># block the C2 domain at DNS/proxy</span>\n<span class='pr'>$</span> echo <span class='bad'>'0.0.0.0 evil-c2.example'</span> &gt;&gt; /etc/hosts.block</div></div><div class='box tip'><div class='bt'>Tip.</div> Capture volatile evidence <em>before</em> you pull the plug. A memory image, running process list, and network connections vanish on shutdown. Order of volatility: registers/cache &rarr; RAM &rarr; network state &rarr; disk &rarr; backups.</div><h3>4. Eradication</h3><p>Remove the attacker's footholds entirely: delete persistence (scheduled tasks, run keys, services, web shells), reset every credential that may have been exposed (assume domain-wide if KRBTGT or a DA account was touched), patch the exploited vulnerability, and rebuild compromised hosts from known-good images. Half-measures invite re-compromise within days.</p><h3>5. Recovery</h3><p>Restore systems to production carefully and <em>watch them</em>. Bring services back in a controlled order, validate integrity, and apply heightened monitoring on previously affected assets to confirm the attacker has not returned. Define explicit exit criteria before declaring the incident closed.</p><h3>6. Lessons Learned</h3><p>Within a couple of weeks, run a blameless post-incident review. What was the root cause? Where did detection lag? Which playbook step was missing? Convert every finding into an action &mdash; a new Sigma rule, a hardening change, a tabletop scenario. This is the loop closing: today's incident becomes tomorrow's preparation.</p><div class='box danger'><div class='bt'>Watch out.</div> Do not destroy evidence or alert the attacker through clumsy containment. Wiping a box before imaging it can erase the only proof of how they got in &mdash; and may breach legal or regulatory obligations. Coordinate with legal and follow chain-of-custody for anything that could end up in court.</div><div class='box law'><div class='bt'>Note.</div> Many incidents carry mandatory breach-notification timelines (GDPR 72 hours, sector regulators, contractual SLAs). Know your reporting obligations <em>before</em> the clock starts.</div><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: run a tabletop incident from alert to lessons-learned using your lab telemetry.</p><ol><li>Trigger a multi-stage attack in your lab (initial access &rarr; persistence &rarr; C2) from earlier parts.</li><li>From the alert, build a timeline in the SIEM and list every affected host and IOC.</li><li>Practice containment: isolate the host and disable the lab account using the commands above.</li><li>Eradicate: locate and remove the persistence mechanism you created.</li><li>Write a one-page post-incident report and turn its top finding into a new detection rule.</li></ol></div></div>"});
add({"id":"p19-6","part":"19 · Blue Team & Detection","nav":"Hunting & Purple","num":"19.6","kicker":"Part 19 · Lesson 6","title":"Threat Hunting & Purple Teaming","html":"<h3>Beyond waiting for alerts</h3><p>Detections catch what you already anticipated. <strong>Threat hunting</strong> is the proactive, hypothesis-driven search for adversary activity that slipped past your alerts. <strong>Purple teaming</strong> is the collaborative exercise where the red team and blue team work <em>together</em> to validate and improve those detections. Together they close the loop that began with the SIEM in Lesson 1.</p><div class='box law'><div class='bt'>Definition.</div> <strong>Threat hunting</strong> assumes breach and asks \"if a competent attacker were already inside, where would I find them?\" It generates new detections as a byproduct. <strong>Purple teaming</strong> runs known attacker techniques in a controlled way to measure and improve detection and response, with red and blue sharing findings in real time.</div><h3>The hunting loop</h3><p>Hunting is structured, not random clicking. A useful model:</p><ol><li><strong>Hypothesis</strong> &mdash; grounded in ATT&amp;CK and threat intel. E.g. \"An attacker is using <code>rundll32</code> to proxy-execute a malicious DLL (T1218.011).\"</li><li><strong>Data</strong> &mdash; identify which telemetry would reveal it (Sysmon EID 1 with parent/child and command line).</li><li><strong>Hunt</strong> &mdash; query, then reduce noise by <em>stacking</em> (frequency analysis): rare combinations are suspicious.</li><li><strong>Findings</strong> &mdash; benign? Note the baseline. Malicious? Escalate to IR. Either way, <strong>codify a detection</strong> so the hunt never has to be repeated by hand.</li></ol><h4>Stacking &amp; frequency analysis</h4><p>The core hunting trick: an attacker's tradecraft is rare, so aggregate and look at the long tail. Group process executions by image and count &mdash; the binary that ran on one host once, at 3am, is far more interesting than the one that runs everywhere all day.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>least-frequency hunt (Elastic ES|QL style)</span></div><div class='term-body'><span class='dim'># find rarely-seen parent/child process pairs</span>\nFROM logs-sysmon-*\n| WHERE event.code == <span class='ok'>\"1\"</span>\n| STATS hosts = COUNT_DISTINCT(host.name) BY\n    parent = process.parent.name, child = process.name\n| WHERE hosts &lt;= <span class='bad'>2</span>\n| SORT hosts ASC\n<span class='dim'># winword.exe -> powershell.exe on 1 host = hunt lead</span></div></div><h3>Purple teaming in practice</h3><p>A purple-team engagement turns hunting hypotheses into experiments. The red team executes a technique &mdash; ideally with reproducible tooling &mdash; while the blue team watches their telemetry live to answer: did we generate the data? did a rule fire? did the analyst triage it correctly? Atomic Red Team makes this repeatable.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>run an atomic test, then verify detection</span></div><div class='term-body'><span class='dim'># blue + red in the same room, lab host only</span>\n<span class='pr'>PS&gt;</span> Invoke-AtomicTest <span class='ok'>T1218.011</span> -TestNumbers 1\n<span class='pr'>PS&gt;</span> <span class='dim'># now in the SIEM, confirm the rule fired</span>\n<span class='pr'>$</span> sigma rule \"rundll32 suspicious\" -> <span class='ok'>ALERT raised</span> ?\n<span class='dim'># no alert -> detection gap -> write/tune a rule -> re-test</span>\n<span class='pr'>PS&gt;</span> Invoke-AtomicTest T1218.011 -Cleanup</div></div><h3>Measuring the program</h3><p>Purple teaming produces hard metrics that justify investment and guide improvement:</p><ul><li><strong>Detection coverage</strong> &mdash; what fraction of executed techniques produced an alert.</li><li><strong>Mean time to detect (MTTD)</strong> and <strong>mean time to respond (MTTR)</strong>.</li><li><strong>Telemetry coverage</strong> &mdash; did we even generate the data, regardless of a rule?</li><li><strong>Visualized in the ATT&amp;CK Navigator</strong>, the same heatmap from Lesson 4, now scored by tested results.</li></ul><div class='box tip'><div class='bt'>Tip.</div> Every hunt and every purple-team exercise should end with a deliverable: a new or tuned Sigma rule, a new telemetry source enabled, or a documented baseline. A hunt that finds nothing and codifies nothing was wasted effort &mdash; capture the negative result as a baseline.</div><div class='box lab'><div class='bt'>Lab discipline.</div> Run every adversary-emulation step in an isolated, authorized lab you own &mdash; never against production or third-party systems without explicit written authorization. Purple teaming is offense in service of defense; keep it inside the same legal and ethical boundaries as the rest of this course.</div><div class='box danger'><div class='bt'>Watch out.</div> Atomics and emulation tools execute real attacker techniques. Some create persistence, modify the registry, or download files. Always run the <code>-Cleanup</code> step, snapshot your VM first, and review each test's source before running it.</div><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: run a complete hunt-to-purple-team cycle and improve your detection coverage.</p><ol><li>Form a hypothesis from ATT&amp;CK (e.g. T1218.011 rundll32 proxy execution).</li><li>Snapshot your lab VM, then run the matching Atomic Red Team test.</li><li>In the SIEM, hunt for the activity using a least-frequency / stacking query.</li><li>If no rule fired, write a Sigma rule and re-run the atomic to confirm it triggers.</li><li>Run the <code>-Cleanup</code>, record MTTD, and update your ATT&amp;CK Navigator coverage layer.</li></ol></div></div>"});
add({"id":"p20-1","part":"20 · Reporting & Engagement","nav":"Rules of Engagement","num":"20.1","kicker":"Part 20 · Lesson 1","title":"Rules of Engagement, Scoping & Legal Authorization","html":"<h3>Why authorization is everything</h3><p>The single line that separates a penetration tester from a criminal is <strong>written authorization</strong>. The identical packet sent at the identical target is a paid engagement in one case and a felony in the other. Before a single port is scanned, the engagement must rest on a signed legal foundation that defines who asked for the test, what they are allowed to authorize, what is in scope, and what happens when something goes wrong. Reporting is not the last phase of an engagement; it begins on day zero with the documents that make the work lawful.</p><p>This lesson covers the contractual and scoping scaffolding that every professional engagement requires. Treat it as non-negotiable. A brilliant exploit chain delivered against an out-of-scope host is a breach of contract at best and a crime at worst.</p><h3>The core documents</h3><ul><li><strong>Master Services Agreement (MSA) / contract</strong> — the overarching legal relationship, liability caps, and payment terms.</li><li><strong>Statement of Work (SOW)</strong> — what you will do, deliverables, timeline, and cost for this specific engagement.</li><li><strong>Rules of Engagement (RoE)</strong> — the operational rulebook: scope, testing windows, permitted techniques, escalation contacts, and stop conditions.</li><li><strong>Authorization letter (\"get-out-of-jail\" letter)</strong> — a signed statement from someone with authority confirming you are permitted to test the named assets during the named window. Carry it on every engagement.</li></ul><div class='box law'><div class='bt'>Law.</div> The person signing must actually own or control the asset. If you test cloud infrastructure, you may also need authorization from the provider, and third-party SaaS often forbids testing entirely. Never assume the client can authorize what they do not own.</div><h3>Defining scope precisely</h3><p>Scope is defined by what is <em>in</em>, what is explicitly <em>out</em>, and the rules that bound it. Ambiguity is the enemy. \"Test our network\" is not scope; it is an invitation to a dispute.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>scope.txt — worked example</span></div><div class='term-body'><span class='cm'># IN SCOPE</span>\n<span class='ok'>203.0.113.0/24</span>  external web tier\n<span class='ok'>app.example.com</span>  + all subdomains *.app.example.com\n<span class='ok'>10.20.0.0/16</span>   internal corp (during onsite window only)\n<span class='cm'># OUT OF SCOPE</span>\n<span class='bad'>billing.example.com</span>  third-party hosted, NO testing\n<span class='bad'>*.partner.net</span>      not client-owned\n<span class='cm'># RULES</span>\n<span class='am'>No DoS / volumetric testing</span>\n<span class='am'>No social engineering of staff</span>\n<span class='am'>Window: Mon-Fri 18:00-06:00 UTC</span>\n<span class='dim'>Data exfil: prove access, do NOT download PII</span></div></div><h3>Stop conditions and emergency contacts</h3><p>The RoE must answer: what do we do when we find evidence of a prior breach, when we crash a production system, or when we stumble onto sensitive data such as health records? Define <strong>stop conditions</strong> that halt testing and trigger immediate notification. Maintain a 24/7 contact on both sides. Agree in advance who you call and how fast.</p><h4>Engagement types and their scoping implications</h4><table><tr><td><strong>Type</strong></td><td><strong>Knowledge given</strong></td><td><strong>Scoping note</strong></td></tr><tr><td>Black box</td><td>None</td><td>More time on recon; budget accordingly</td></tr><tr><td>Grey box</td><td>Partial (creds, docs)</td><td>Most common; document what was provided</td></tr><tr><td>White box</td><td>Full (source, arch)</td><td>Deepest coverage; needs NDA on source</td></tr></table><div class='box tip'><div class='bt'>Tip.</div> Capture client IP ranges and your own testing source IPs in the RoE. This lets the blue team distinguish your traffic from a real attacker and lets you prove what was and was not you if an incident is later disputed.</div><h3>Handling scope creep</h3><p>Mid-engagement, clients often ask \"while you are in there, can you also check X?\" The correct answer is never a casual yes. Any change to scope is a change to authorization. Document it: an email confirmation from the authorizing party, appended to the RoE, is the minimum. Significant additions warrant a SOW amendment.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: produce a complete Rules of Engagement document for a fictional client, MediCorp, with a public web app and an internal network.</p><ol><li>Draft an in-scope and out-of-scope asset list using CIDR ranges and explicit hostnames.</li><li>Define a testing window, three prohibited techniques, and a data-handling rule for PII.</li><li>Write two stop conditions and name the emergency escalation path for each side.</li><li>Add a clause covering scope-change requests and how they will be authorized in writing.</li><li>List the four core documents this engagement would require and who must sign each.</li></ol></div></div>"});
add({"id":"p20-2","part":"20 · Reporting & Engagement","nav":"Notes & Evidence","num":"20.2","kicker":"Part 20 · Lesson 2","title":"Note-Taking & Evidence Handling","html":"<h3>Your report is only as good as your notes</h3><p>The quality of a final report is decided during testing, not after. A finding you cannot reproduce, a screenshot without context, or a command you forgot to log is a finding you cannot credibly deliver. Professional testers treat note-taking as a primary deliverable that runs continuously in the background of every action. The discipline is the same one used in incident response and forensics: <strong>contemporaneous, attributable, and tamper-evident records</strong>.</p><h3>What to capture for every finding</h3><p>For each vulnerability, your notes must let a stranger reproduce the result months later. Capture the five W's of evidence:</p><ul><li><strong>Target</strong> — exact host, IP, URL, port, and parameter.</li><li><strong>Timestamp</strong> — when, in a consistent timezone (UTC is safest).</li><li><strong>Action</strong> — the precise command or request sent, copy-paste exact.</li><li><strong>Result</strong> — the raw response or behavior proving impact.</li><li><strong>Operator</strong> — who performed it, on which source IP.</li></ul><div class='box tip'><div class='bt'>Tip.</div> Log your terminal automatically. Tools like <code>script -q session.log</code> or <code>tmux</code> logging capture every command and response with timestamps, so you never lose the exact syntax that worked at 3 a.m.</div><h3>Screenshots that survive scrutiny</h3><p>A screenshot is evidence only if it is unambiguous. Always include the address bar or terminal prompt showing the target, a visible timestamp where possible, and the result that proves impact. Crop nothing that establishes context. Redact real PII before it ever leaves your machine — capture proof of access, not the records themselves.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>evidence log entry</span></div><div class='term-body'><span class='cm'># FINDING-014 — SQLi in /search?q=</span>\n<span class='dim'>2026-06-07T02:14:33Z  op:r.avery  src:198.51.100.7</span>\n<span class='ok'>req:</span> GET /search?q=test%27%20OR%201=1--\n<span class='ok'>resp:</span> 200, returned 4,812 rows (baseline: 3)\n<span class='pr'>evidence:</span> shots/f014_payload.png, shots/f014_dump.png\n<span class='am'>note:</span> error-based; DB = MySQL 5.7 (banner in resp)\n<span class='dim'>PII observed but NOT downloaded per RoE</span></div></div><h3>Chain of custody</h3><p>Chain of custody is the documented, unbroken history of every piece of evidence: who collected it, when, where it has been stored, and who has accessed it. In most pentests you will not testify in court, but you should behave as if you might. If a finding leads to a real incident, your evidence may become part of a legal proceeding, and an unbroken chain is what makes it admissible and trustworthy.</p><table><tr><td><strong>Field</strong></td><td><strong>Purpose</strong></td></tr><tr><td>Item ID</td><td>Unique reference per artifact</td></tr><tr><td>Collected by / when</td><td>Attribution and timing</td></tr><tr><td>Hash (SHA-256)</td><td>Proves the file is unchanged</td></tr><tr><td>Storage location</td><td>Encrypted, access-controlled</td></tr><tr><td>Access log</td><td>Every handler recorded</td></tr></table><div class='box danger'><div class='bt'>Danger.</div> Evidence often contains live credentials, tokens, and PII. Store it encrypted at rest, transmit only over encrypted channels, and securely destroy it per the contract's data-retention clause once the engagement closes. A leaked evidence archive is a breach <em>you</em> caused.</div><h3>Hashing artifacts</h3><p>For any file artifact — a memory dump, a captured config, an exfiltrated proof file — record a cryptographic hash at collection time. If anyone later asks whether the file was altered, the hash answers definitively.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>hashing for integrity</span></div><div class='term-body'><span class='cm'># record hash at moment of collection</span>\n<span class='ok'>$ sha256sum proof_access.txt > proof_access.sha256</span>\n<span class='dim'>e3b0c44298fc1c149afbf4c8996fb924...  proof_access.txt</span>\n<span class='cm'># anyone can later re-verify</span>\n<span class='ok'>$ sha256sum -c proof_access.sha256</span>\n<span class='ok'>proof_access.txt: OK</span></div></div><h3>Organize as you go</h3><p>Adopt a per-engagement folder structure on day one: <code>recon/</code>, <code>scans/</code>, <code>findings/</code>, <code>shots/</code>, <code>loot/</code>, and a running <code>notes.md</code>. Name screenshots by finding ID. When report-writing day arrives, you assemble rather than excavate.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: build a reproducible evidence package for one finding from any prior lab.</p><ol><li>Start a logged terminal session with <code>script</code> or tmux logging.</li><li>Re-run the exploit and capture two screenshots showing target context and impact.</li><li>Write an evidence-log entry containing target, UTC timestamp, exact request, result, and operator.</li><li>Create a proof file and record its SHA-256 hash; verify the hash afterward.</li><li>Lay out the per-engagement folder structure and place each artifact correctly.</li></ol></div></div>"});
add({"id":"p20-3","part":"20 · Reporting & Engagement","nav":"Executive Summary","num":"20.3","kicker":"Part 20 · Lesson 3","title":"Writing the Executive Summary","html":"<h3>The most-read page nobody technical writes well</h3><p>The executive summary is the only section many decision-makers will ever read, yet it is the section testers most often get wrong. They fill it with payloads, CVE numbers, and tool output that mean nothing to a CFO deciding whether to fund remediation. The executive summary exists to translate technical risk into <strong>business risk</strong> for an audience that controls budget and accepts liability but does not write code.</p><p>Write it last, after every finding is understood, but place it first. Aim for one to two pages. If a board member reads only this, they should understand what you tested, how exposed the organization is, and what to do next.</p><h3>What a non-technical reader needs</h3><ul><li><strong>Context</strong> — what was assessed, when, and why (scope in plain words).</li><li><strong>Overall posture</strong> — a clear verdict, not a hedge. Are they in good shape or not?</li><li><strong>Business impact</strong> — what an attacker could actually do: steal customer data, halt operations, commit fraud.</li><li><strong>Risk at a glance</strong> — a simple count of findings by severity.</li><li><strong>Top priorities</strong> — the two or three things to fix first, in business terms.</li></ul><div class='box tip'><div class='bt'>Tip.</div> Replace jargon with consequences. Not \"unauthenticated RCE on the Jenkins host\" but \"an attacker on the internet could take full control of the system that builds and deploys your software, allowing them to insert malicious code into your product.\"</div><h3>Lead with impact, not method</h3><p>Executives think in terms of money, reputation, regulation, and continuity. Anchor every key point to one of those. A single sentence that says \"we were able to access the personal records of all 1.2 million customers, which would be a reportable breach under GDPR carrying fines up to 4% of global revenue\" lands harder than three paragraphs of HTTP requests.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>weak vs strong phrasing</span></div><div class='term-body'><span class='bad'>WEAK:</span> Found IDOR in the /account endpoint\n       returning other users' objects.\n<span class='ok'>STRONG:</span> Any logged-in customer could view and\n        modify other customers' accounts, exposing\n        financial data for the entire user base and\n        enabling fraud. Reportable under GDPR.\n<span class='dim'>The technical detail belongs in the findings section,\nnot here.</span></div></div><h3>A risk-rating snapshot they can scan</h3><p>Give leadership a single visual-as-text summary they can absorb in five seconds. A severity tally and a one-line posture statement do more than any paragraph.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>risk snapshot</span></div><div class='term-body'><span class='term-title'>Overall posture: HIGH RISK</span>\n<span class='bad'>Critical .... 2</span>\n<span class='pr'>High ........ 5</span>\n<span class='am'>Medium ...... 8</span>\n<span class='ok'>Low ......... 6</span>\n<span class='dim'>Informational 4</span>\n<span class='cm'># Two critical issues allow full takeover of</span>\n<span class='cm'># customer-facing systems and must be fixed now.</span></div></div><h3>Structure that works</h3><ol><li><strong>Engagement overview</strong> — two or three sentences on scope, dates, and methodology in plain language.</li><li><strong>Key findings</strong> — a short narrative of the most significant business risks.</li><li><strong>Risk summary</strong> — the severity snapshot.</li><li><strong>Strategic recommendations</strong> — themes, not tasks: \"establish a patch-management program,\" \"adopt MFA org-wide.\"</li><li><strong>Positive observations</strong> — what they are doing well. Credibility comes from balance.</li></ol><div class='box law'><div class='bt'>Law.</div> The executive summary may be read by regulators, auditors, cyber-insurers, and litigators. Be accurate and defensible. Never overstate impact to dramatize, and never understate it to protect a relationship. Both can carry legal consequences for you and the client.</div><h3>Tone and length</h3><p>Confident, neutral, and concise. Avoid fear-mongering; executives discount alarmism. Avoid false reassurance; it gets you blamed when a real breach follows. One to two pages, no acronyms without expansion, no screenshots. End with a clear sentence on next steps and the path to a debrief.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: write a one-page executive summary from a set of findings (use a prior lab's results).</p><ol><li>Write a three-sentence engagement overview with scope and dates in plain English.</li><li>Produce a severity snapshot tallying findings and a one-line overall posture.</li><li>Describe the top two business risks in terms of money, data, or operations — no jargon.</li><li>List three strategic recommendations as themes, plus two positive observations.</li><li>Re-read it as if you were a CFO: cut any sentence that requires technical knowledge to understand.</li></ol></div></div>"});
add({"id":"p20-4","part":"20 · Reporting & Engagement","nav":"Findings & CVSS","num":"20.4","kicker":"Part 20 · Lesson 4","title":"Technical Findings & CVSS Scoring","html":"<h3>The evidence-grade core of the report</h3><p>The technical findings section is written for the engineers, security staff, and reviewers who must validate and fix each issue. Where the executive summary trades in business consequences, findings trade in <strong>reproducible technical truth</strong>. Each finding is a self-contained case file: what it is, where it is, how severe it is, how to prove it, and how to fix it. If a reader cannot reproduce your finding from the write-up alone, it is incomplete.</p><h3>Anatomy of a finding</h3><ul><li><strong>Title</strong> — specific and neutral: \"SQL Injection in Search Parameter,\" not \"Critical DB hack.\"</li><li><strong>Severity</strong> — a rating plus CVSS vector and score.</li><li><strong>Affected assets</strong> — exact hosts, URLs, parameters.</li><li><strong>Description</strong> — what the flaw is and why it exists.</li><li><strong>Impact</strong> — what an attacker achieves by exploiting it.</li><li><strong>Evidence / reproduction</strong> — numbered steps, requests, and screenshots.</li><li><strong>Remediation</strong> — covered in depth next lesson, but referenced here.</li><li><strong>References</strong> — CWE, OWASP, vendor advisories.</li></ul><h3>CVSS in practice</h3><p>The Common Vulnerability Scoring System gives findings a comparable, defensible severity from 0.0 to 10.0. CVSS v3.1 base metrics describe the vulnerability's intrinsic properties independent of any one environment. You compute a vector string from the metrics, and the vector produces the numeric score and a qualitative band.</p><table><tr><td><strong>Metric</strong></td><td><strong>Question it answers</strong></td></tr><tr><td>Attack Vector (AV)</td><td>Network, Adjacent, Local, or Physical?</td></tr><tr><td>Attack Complexity (AC)</td><td>Low or High effort to exploit?</td></tr><tr><td>Privileges Required (PR)</td><td>None, Low, or High access needed?</td></tr><tr><td>User Interaction (UI)</td><td>Must a victim do something?</td></tr><tr><td>Scope (S)</td><td>Does impact spill beyond the component?</td></tr><tr><td>C / I / A</td><td>Confidentiality, Integrity, Availability impact</td></tr></table><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>CVSS bands &amp; a worked vector</span></div><div class='term-body'><span class='ok'>0.1-3.9</span> Low   <span class='am'>4.0-6.9</span> Medium\n<span class='pr'>7.0-8.9</span> High  <span class='bad'>9.0-10.0</span> Critical\n<span class='cm'># Unauthenticated SQLi over the internet:</span>\n<span class='dim'>AV:N AC:L PR:N UI:N S:U C:H I:H A:H</span>\n<span class='bad'>Base score = 9.8 (Critical)</span>\n<span class='cm'># Same flaw but auth required (PR:L):</span>\n<span class='pr'>AV:N AC:L PR:L UI:N S:U C:H I:H A:H = 8.8 (High)</span></div></div><div class='box tip'><div class='bt'>Tip.</div> Always publish the full vector string, not just the number. The vector lets the client recompute with environmental metrics for their own context — a flaw scored High in the abstract may be Critical on a system holding regulated data, or lower on an isolated test box.</div><h3>Severity is risk, not just CVSS</h3><p>CVSS measures technical severity, but business risk also factors in asset value, exposure, and likelihood. A medium-CVSS issue on the crown-jewel database may warrant a higher business priority than a high-CVSS issue on a throwaway host. State both your CVSS base score and your contextual risk rating, and explain any divergence so the reader trusts your judgment.</p><h3>Write reproduction steps a junior can follow</h3><p>Reproduction is the heart of a finding. Number every step, include exact requests and payloads, and reference the screenshot that proves each result. Assume the reader has the same access you had and nothing more.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>FINDING-014 reproduction</span></div><div class='term-body'><span class='term-title'>SQL Injection — /search (q parameter)</span>\n<span class='pr'>Severity:</span> Critical  <span class='dim'>CVSS 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)</span>\n<span class='ok'>1.</span> Browse to https://app.example.com/search\n<span class='ok'>2.</span> Submit q = <span class='am'>test' OR 1=1-- -</span>\n<span class='ok'>3.</span> Observe full row dump (4,812 vs 3 baseline)\n<span class='ok'>4.</span> Confirm DB via q = test' AND 1=CAST(@@version AS int)--\n<span class='dim'>Evidence: shots/f014_payload.png, shots/f014_dump.png</span>\n<span class='cm'>CWE-89 · OWASP A03:2021 Injection</span></div></div><div class='box danger'><div class='bt'>Danger.</div> When demonstrating impact, prove access without causing harm. Reading one record or the database version proves SQLi; dumping the whole customer table to your laptop is unnecessary, risky, and likely outside your RoE.</div><h3>Consistency makes the report trustworthy</h3><p>Use one template for every finding, one severity scheme, and one CVSS version throughout. Inconsistency makes a reader doubt the rigor of the whole assessment.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: write two complete technical findings with CVSS scores from prior lab results.</p><ol><li>Pick two vulnerabilities of differing severity from earlier labs.</li><li>For each, build a CVSS v3.1 base vector by reasoning through AV, AC, PR, UI, S, and C/I/A.</li><li>Record the resulting score and qualitative band; state a contextual risk rating and justify any difference.</li><li>Write numbered reproduction steps with exact payloads and referenced screenshots.</li><li>Add affected assets, a CWE reference, and an OWASP category to each finding.</li></ol></div></div>"});
add({"id":"p20-5","part":"20 · Reporting & Engagement","nav":"Remediation Guidance","num":"20.5","kicker":"Part 20 · Lesson 5","title":"Remediation Guidance Developers Can Act On","html":"<h3>Finding the bug is half the job</h3><p>A report that lists fifty problems and no actionable fixes leaves the client exactly where they started, only more anxious. The value you deliver is not the vulnerability; it is the credible, specific path to closing it. Good remediation guidance is written for the person who has to implement it — usually a developer or sysadmin under deadline pressure — and it respects their constraints. Vague advice like \"sanitize inputs\" or \"apply best practices\" is worse than nothing, because it sounds like a fix while providing none.</p><h3>What makes remediation actionable</h3><ul><li><strong>Specific</strong> — names the exact change, not a category.</li><li><strong>Correct</strong> — addresses the root cause, not just the symptom you demonstrated.</li><li><strong>Concrete</strong> — includes the corrected pattern, config, or code snippet.</li><li><strong>Verifiable</strong> — tells them how to confirm the fix worked.</li><li><strong>Prioritized</strong> — fits into a remediation plan with effort and order.</li></ul><div class='box tip'><div class='bt'>Tip.</div> Fix the class, not the instance. If you found SQL injection in one parameter, the real recommendation is to adopt parameterized queries everywhere, not to escape that one input. Otherwise you will be back next year finding the same flaw in a different field.</div><h3>Show the corrected pattern</h3><p>Developers trust guidance they can copy and adapt. For an injection finding, contrast the vulnerable pattern with the secure one in their language. The goal is to make the right way the easy way.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>SQLi remediation — before / after</span></div><div class='term-body'><span class='bad'># VULNERABLE: string concatenation</span>\n<span class='bad'>q = \"SELECT * FROM users WHERE name='\" + name + \"'\"</span>\n<span class='ok'># FIXED: parameterized query</span>\n<span class='ok'>cur.execute(\"SELECT * FROM users WHERE name=%s\", (name,))</span>\n<span class='cm'># Root cause: user data treated as code.</span>\n<span class='cm'># Class fix: parameterize ALL queries; add an ORM</span>\n<span class='cm'># or query-builder standard across the codebase.</span>\n<span class='dim'>Verify: re-run FINDING-014 payload; expect 0 extra rows.</span></div></div><h3>Layered defense, not single points</h3><p>Strong guidance often recommends defense in depth: the primary fix plus compensating controls. For the SQLi above, the primary fix is parameterization; compensating controls include least-privilege database accounts, a web application firewall, and input validation. Make clear which is the real fix and which are safety nets, so the team does not deploy a WAF rule and call it done.</p><h3>Prioritize with a remediation plan</h3><p>Clients have finite engineering hours. Help them sequence the work by pairing severity with effort. A critical issue that takes ten minutes to patch should be done today; a high issue requiring an architecture change is planned. A simple effort-versus-impact table turns a list of complaints into a roadmap.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>remediation roadmap</span></div><div class='term-body'><span class='cm'>Finding        Sev     Effort   When</span>\n<span class='bad'>SQLi /search   Crit    Low      Now (hotfix)</span>\n<span class='pr'>No MFA admin   High    Med      This sprint</span>\n<span class='pr'>Outdated TLS   High    Low      This week</span>\n<span class='am'>Verbose errors Medium  Low      Next sprint</span>\n<span class='ok'>Missing CSP    Low     Med      Backlog</span>\n<span class='dim'>Quick wins (low effort, high sev) go first.</span></div></div><div class='box law'><div class='bt'>Law.</div> Some findings map to compliance obligations (PCI DSS, HIPAA, SOC 2). Where relevant, note the standard a fix satisfies. Framing remediation against an obligation the client already owns often unlocks the budget to do it.</div><h3>Address the underlying causes</h3><p>Beyond per-finding fixes, offer strategic recommendations that prevent whole categories of issues: secure-coding training, SAST/DAST in the CI pipeline, a dependency-update policy, MFA everywhere, centralized logging. These belong near the end of the report and tie back to the executive summary's strategic themes.</p><div class='box danger'><div class='bt'>Danger.</div> Never recommend a fix you have not reasoned through. Suggesting a setting that breaks production or a library with its own known vulnerabilities destroys your credibility and can cause real harm. If you are unsure, say \"validate in staging\" and explain the trade-off.</div><h3>Write for the implementer's reality</h3><p>Acknowledge constraints: legacy systems, frameworks they cannot abandon, third-party components. Offer a primary recommendation and, where the ideal is impractical, a pragmatic interim control. Guidance the team can actually ship beats a perfect fix they will ignore.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: write developer-ready remediation for three findings from prior labs.</p><ol><li>For each finding, state the root-cause class, not just the demonstrated instance.</li><li>Provide a before/after code or config snippet showing the corrected pattern.</li><li>List one primary fix plus at least one compensating control per finding.</li><li>Give a verification step the team can run to confirm the fix worked.</li><li>Build an effort-versus-severity roadmap table sequencing all three, and note any compliance standard each fix supports.</li></ol></div></div>"});
add({"id":"p20-6","part":"20 · Reporting & Engagement","nav":"Debrief & Capstone","num":"20.6","kicker":"Part 20 · Lesson 6","title":"Client Debrief, Report Template & Capstone","html":"<h3>Delivery is part of the work</h3><p>A report that is emailed and never discussed loses much of its value. The <strong>client debrief</strong> is where you walk stakeholders through the findings, answer questions, correct misunderstandings, and hand off ownership of remediation. It also closes the engagement professionally and sets up the relationship for retesting and future work. This final lesson covers the debrief, gives you a reusable report template, and sets the capstone: writing a complete report from a prior lab's findings.</p><h3>Running the debrief</h3><p>Tailor the room. Executives want the summary, risk posture, and strategic recommendations; engineers want the findings and fixes. Often you run two sessions, or one session structured so non-technical attendees can leave after the first half. Keep it a conversation, not a lecture.</p><ul><li><strong>Open</strong> with scope, methodology, and overall posture — set expectations.</li><li><strong>Walk the highlights</strong> — top critical and high findings with live or screenshot demos.</li><li><strong>Discuss remediation</strong> — agree on priorities and owners, not just problems.</li><li><strong>Handle pushback</strong> — distinguish genuine false positives from discomfort; verify, then concede or stand firm with evidence.</li><li><strong>Close</strong> — confirm next steps, retest timeline, and report-delivery format.</li></ul><div class='box tip'><div class='bt'>Tip.</div> A finding the client disputes is an opportunity, not a threat. Reproduce it live if you can. Being able to demonstrate the issue on demand ends the debate instantly and builds enormous trust in the rest of your report.</div><h3>Retesting and the engagement's end</h3><p>Most engagements include a retest after remediation. Define up front what closure means: each finding is marked Fixed, Partially Fixed, Risk Accepted, or Open, with evidence for each. A clean retest letter is often what the client needs for auditors or customers, so treat it as a real deliverable.</p><div class='box law'><div class='bt'>Law.</div> When the engagement closes, honor the contract's data-retention and destruction terms. Securely delete evidence, credentials, and loot on the agreed schedule, and confirm destruction in writing. Holding client breach data longer than authorized is a liability you do not want.</div><h3>A reusable report template</h3><p>Standardize your report structure so every engagement is consistent and you spend your time on analysis, not formatting. The following skeleton scales from a small web-app test to a full network assessment.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>pentest report — master template</span></div><div class='term-body'><span class='ok'>1. Cover &amp; document control</span> <span class='dim'>client, dates, version, classification</span>\n<span class='ok'>2. Executive summary</span> <span class='dim'>posture, business risk, top priorities</span>\n<span class='ok'>3. Scope &amp; methodology</span> <span class='dim'>assets, RoE summary, approach</span>\n<span class='ok'>4. Risk summary</span> <span class='dim'>severity tally, findings index table</span>\n<span class='ok'>5. Technical findings</span> <span class='dim'>one per finding, full template</span>\n   <span class='dim'>title · severity+CVSS · assets · description</span>\n   <span class='dim'>impact · reproduction · evidence · remediation</span>\n<span class='ok'>6. Strategic recommendations</span> <span class='dim'>root-cause themes</span>\n<span class='ok'>7. Appendices</span> <span class='dim'>tool list, full scan output, glossary</span>\n<span class='pr'>Classification: CONFIDENTIAL</span></div></div><div class='box tip'><div class='bt'>Tip.</div> Add a findings index table right after the risk summary: ID, title, severity, and CVSS in one scannable list. Readers use it to jump straight to what matters, and it doubles as your remediation tracking sheet.</div><h3>Quality bar before you ship</h3><p>Self-review against a checklist: is every finding reproducible, every severity justified by a CVSS vector, every screenshot redacted, every recommendation actionable? Is the executive summary jargon-free? Does the document classification appear on every page? Have a second tester peer-review when possible — fresh eyes catch the error you have read past ten times.</p><div class='box danger'><div class='bt'>Danger.</div> Reports contain a roadmap to compromise the client. Mark every page CONFIDENTIAL, deliver only through an encrypted channel, and never reuse one client's real data, screenshots, or names in another report or a portfolio.</div><h3>The capstone</h3><p>You now have every component: lawful scope, disciplined evidence, an executive summary that speaks to business, technical findings scored with CVSS, remediation developers can ship, and a debrief that lands it. The capstone brings them together into one professional artifact.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: produce a complete, professional penetration-test report from a prior lab's findings set.</p><ol><li>Assemble the findings, evidence, and screenshots from one earlier lab into the per-engagement folder structure.</li><li>Fill every section of the master template: cover/control, executive summary, scope &amp; methodology, risk summary with findings index, technical findings, strategic recommendations, and appendices.</li><li>Score each finding with a CVSS v3.1 vector and write reproduction steps a junior could follow.</li><li>Write developer-ready remediation with a prioritized roadmap and verification steps.</li><li>Prepare a five-minute debrief: pick the top three findings, plan how you would demo one live, and draft the retest closure table (Fixed / Partial / Risk Accepted / Open).</li><li>Run the quality checklist, mark every page CONFIDENTIAL, and note how you would deliver and later destroy the report per contract.</li></ol></div></div>"});
add({"id":"p21-1","part":"21 · Certs & Career","nav":"Cert map","num":"21.1","kicker":"Part 21 · Lesson 1","title":"Mapping This Course to the Major Certs","html":"<h3>Certs are a means, not the goal</h3><p>A certification is a portable, hiring-manager-legible signal that you can do a body of work under defined conditions. It is never the same thing as skill, but it gets your resume past filters and validates that the months you spent in this masterclass map to an industry standard. The trick is to pick the cert that matches the <em>job you want</em>, not the one with the loudest marketing. This lesson maps everything you have learned so far onto the four certs that matter most for someone breaking in, and gives you a decision rule for which to pursue first.</p><h3>The four that matter for breaking in</h3><p>Each cert answers a different question for an employer. Security+ answers <em>do you understand the language and fundamentals of the field?</em> CEH answers <em>do you know the named tools and attack categories?</em> PNPT answers <em>can you run a realistic internal pentest end-to-end and report it?</em> OSCP answers <em>can you exploit unfamiliar machines under time pressure without giving up?</em> They sit on a ladder of cost, difficulty, and credibility.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>cert-comparison.txt</span></div><div class='term-body'><span class='cm'># cert         format            ~cost     difficulty   best signal for</span>\n<span class='ok'>Security+</span>     90 multiple-choice  ~$400     entry        SOC / blue / govt (DoD 8570)\n<span class='ok'>CEH</span>          125 MC (+practical) ~$1200    entry-mid    HR keyword filters, gov contracts\n<span class='ok'>PNPT</span>         5-day practical    ~$400     mid          realistic internal pentest + AD\n<span class='ok'>OSCP</span>         24h exam + report  ~$1600    hard         offensive / pentest gatekeeper</div></div><h3>How your course modules line up</h3><p>You are not starting from zero on any of these. The foundations, Linux, and networking work you did maps to <strong>Security+</strong> domains almost directly. Your scanning, enumeration, and exploitation modules are the heart of <strong>PNPT</strong> and <strong>OSCP</strong>. Your Active Directory and privilege-escalation work is exactly what PNPT tests and what OSCP added in its modern syllabus. Web attacks line up with the PortSwigger material you will drill in Lesson 3.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>course-to-cert.map</span></div><div class='term-body'><span class='cm'>This course module            -> reinforces</span>\nFoundations + Linux + Net      <span class='ok'>Security+, OSCP basics</span>\nScanning + Enumeration         <span class='ok'>OSCP, PNPT, CEH</span>\nExploitation + priv-esc        <span class='ok'>OSCP, PNPT</span>\nActive Directory               <span class='am'>PNPT (core), OSCP (added)</span>\nWeb attacks                    <span class='ok'>PNPT, PortSwigger BSCP</span>\nReport writing                 <span class='ok'>PNPT, OSCP (exam report)</span></div></div><h3>Which one first?</h3><p>Use a simple decision rule based on your target role and runway. There is no single right answer, only the right answer <em>for your situation</em>.</p><ul><li><strong>You want a SOC / blue-team / defensive or government role:</strong> start with <strong>Security+</strong>. It is the most cited keyword in entry-level job postings and satisfies US DoD 8570 baseline requirements.</li><li><strong>You want offensive / pentesting and have time to grind:</strong> aim for <strong>OSCP</strong>, but do <strong>PNPT first</strong> as a cheaper, less brutal proof you can run a full engagement and write the report.</li><li><strong>HR filters in your region demand it:</strong> some markets and contracts list <strong>CEH</strong> by name. Treat it as a checkbox, not a skills milestone.</li><li><strong>Tight budget, want maximum bang-for-buck:</strong> <strong>PNPT</strong> teaches and tests the most job-relevant skills per dollar.</li></ul><div class='box tip'><div class='bt'>Tip.</div> Never collect certs in a vacuum. One cert plus a public portfolio of real write-ups beats three certs and an empty GitHub. Hiring managers can smell a paper certificate.</div><div class='box law'><div class='bt'>Law.</div> Every cert exam ships with a code of conduct and rules of engagement. Cheating, sharing exam content, or attacking out-of-scope hosts during a practical exam is grounds for a permanent ban and can be a crime. Treat exam labs with the same ethics as a real client network.</div><h3>Sequencing across a year</h3><p>A realistic, sustainable path for someone employed full-time: Security+ in months 1-2 (it is mostly reading plus this course's fundamentals), PNPT in months 3-6 (practical, builds offensive muscle), then OSCP in months 7-12 if you are committed to offensive work. Skip CEH unless a specific job posting or contract demands it.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: produce a personal, written cert roadmap you will actually follow.</p><ol><li>Write down the exact job title and seniority you want in 12 months (e.g. \"Junior Penetration Tester\" or \"SOC Analyst I\").</li><li>Pull 5 real job postings for that title and tally which certs each one lists as required vs preferred.</li><li>Using the decision rule above, pick your FIRST cert and justify it in two sentences.</li><li>Map at least 4 modules from this course to that cert's exam objectives, so you know what to revise.</li><li>Set target exam dates and a weekly study budget in hours. Save this as your roadmap and revisit it monthly.</li></ol></div></div>"});
add({"id":"p21-2","part":"21 · Certs & Career","nav":"Home lab","num":"21.2","kicker":"Part 21 · Lesson 2","title":"Building a Home Lab That Pays Off","html":"<h3>Why a home lab is non-negotiable</h3><p>Every skill in this course rusts without practice, and you cannot legally practice on systems you do not own or have explicit permission to test. A home lab is your sandbox: a controlled, isolated environment where you can break things, snapshot, revert, and try again. It is also a portfolio artifact in its own right. \"I built and maintain a 6-VM Active Directory lab with a vulnerable web app and an attacker box\" is a sentence that ends interviews well. This lesson shows you how to build one that is cheap, safe, and actually used.</p><h3>The minimum viable lab</h3><p>You do not need a server rack. A laptop with 16 GB of RAM and a hypervisor gets you started. The core is one attacker machine and one or more vulnerable targets, all on an <strong>isolated host-only or internal network</strong> so nothing leaks to your home LAN or the internet.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>lab-topology.txt</span></div><div class='term-body'><span class='cm'># isolated 'internal' network 10.10.10.0/24 - no NAT to home LAN</span>\n<span class='ok'>[Kali attacker]</span>      10.10.10.5\n<span class='ok'>[Metasploitable2]</span>   10.10.10.10   (linux, deliberately weak)\n<span class='ok'>[Windows 10 client]</span>  10.10.10.20\n<span class='am'>[Windows Server DC]</span>  10.10.10.30   (Active Directory domain)\n<span class='dim'>host machine</span>         no IP on this net <span class='cm'># keep host out</span></div></div><h3>Choosing your hypervisor and resources</h3><p>VirtualBox is free and fine to start. VMware Workstation/Fuk/ESXi and Proxmox are stronger if you grow. The discipline that matters more than the product is <strong>snapshots</strong>: snapshot every VM in a known-good state before you attack it, so a single click reverts the damage. RAM is your real constraint; thin-provision disks and only power on the VMs you need for a given exercise.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>resource-budget.txt</span></div><div class='term-body'><span class='cm'># rough RAM per VM, power on only what you need</span>\nKali               2-4 GB\nMetasploitable2    0.5 GB\nWindows 10 client  2-4 GB\nWindows Server DC  2-4 GB\n<span class='ok'>16 GB host  -> comfortably run attacker + 2 targets</span>\n<span class='am'>8 GB host   -> run attacker + 1 target, revert often</span></div></div><h3>Stocking the lab with targets</h3><p>Build a mix of intentionally vulnerable boxes and realistic services so you practice the full kill chain, not just one trick.</p><ul><li><strong>Linux victims:</strong> Metasploitable2/3, and downloadable VulnHub boxes for varied difficulty.</li><li><strong>Web apps:</strong> OWASP Juice Shop, DVWA, and bWAPP for deliberate web flaws (mirrors the PortSwigger work in Lesson 3).</li><li><strong>Active Directory:</strong> a single Windows Server as a domain controller plus one joined client gives you Kerberos, SMB, and lateral-movement practice. Automated lab builders like GOAD (Game of Active Directory) deploy a vulnerable multi-host domain if you have the resources.</li></ul><div class='box danger'><div class='bt'>Danger.</div> Intentionally vulnerable VMs are magnets for real malware. NEVER bridge them to your home network or the internet. Use host-only/internal networking, and if a target needs updates, snapshot first, attach NAT briefly, then detach and revert the network adapter.</div><div class='box law'><div class='bt'>Law.</div> The lab keeps you legal. The whole point is that you own every target. The moment you point your tools at a system you do not own or lack written authorization to test, you have crossed from practice into a potential felony under computer-misuse law.</div><h3>Documentation habit from day one</h3><p>Keep a lab journal: a simple Markdown file per target with the date, what you tried, what worked, and the commands you ran. This journal becomes the raw material for the write-ups in Lesson 3 and the portfolio in Lesson 5. The single biggest difference between people who build a lab and people who get hired from a lab is that the latter <strong>wrote down what they did</strong>.</p><div class='box tip'><div class='bt'>Tip.</div> Treat \"infrastructure as notes\": record each VM's role, IP, credentials, and snapshot name in one index file. When you return after two weeks away, you can be hacking again in five minutes instead of rebuilding from memory.</div><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: stand up a working, isolated two-machine lab and prove it works.</p><ol><li>Install a hypervisor (VirtualBox is fine) and create a host-only/internal network named <code>lab-internal</code>.</li><li>Import a Kali VM and one vulnerable target (start with Metasploitable2). Attach both to <code>lab-internal</code> only.</li><li>Confirm isolation: from a target, verify you CANNOT ping your home router or 8.8.8.8.</li><li>From Kali, run <code>nmap -sV 10.10.10.0/24</code> and confirm you can see the target's open services.</li><li>Snapshot every VM in its clean state and name the snapshots <code>clean-base</code>.</li><li>Create <code>lab-index.md</code> recording each VM's role, IP, and snapshot name. This file is the seed of your portfolio.</li></ol></div></div>"});
add({"id":"p21-3","part":"21 · Certs & Career","nav":"CTFs & practice","num":"21.3","kicker":"Part 21 · Lesson 3","title":"CTFs & Deliberate Practice on HTB, THM & PortSwigger","html":"<h3>From random hacking to deliberate practice</h3><p>Most people who plateau do the same thing forever: they solve boxes they already know how to solve, watch a walkthrough the moment they get stuck, and never reflect afterward. That is activity, not improvement. <em>Deliberate practice</em> means working at the edge of your ability on tasks with a clear goal, getting immediate feedback, and reviewing your mistakes. This lesson turns the three platforms you should live in into a structured training program rather than a time sink.</p><h3>The three platforms and what each is for</h3><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>platforms.txt</span></div><div class='term-body'><span class='cm'># platform        strength                         use it for</span>\n<span class='ok'>TryHackMe</span>        guided rooms, learning paths     building fundamentals, blue + red\n<span class='ok'>HackTheBox</span>       unguided machines, ranked        exam-style problem solving (OSCP)\n<span class='ok'>PortSwigger</span>      free Web Security Academy        deep web app skills, BSCP prep</div></div><p><strong>TryHackMe</strong> holds your hand with explanations and is ideal when a topic is new. <strong>HackTheBox</strong> drops you on a machine with no hints, which is exactly the OSCP exam experience. <strong>PortSwigger's Web Security Academy</strong> is the gold standard for web vulnerabilities and is entirely free, with labs that map to real bugs you will find in bug bounty.</p><h3>The OSCP-style methodology, every time</h3><p>The reason to grind boxes is to make a repeatable methodology automatic, so that under exam or engagement pressure you never freeze. Run the same loop on every machine.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>box-methodology.txt</span></div><div class='term-body'><span class='ok'>1. ENUMERATE</span>   full port scan, then service/version scan\n<span class='ok'>2. ENUMERATE</span>   again, per service (web dirs, SMB shares, etc.)\n<span class='ok'>3. FOOTHOLD</span>    find the entry vuln, get a low-priv shell\n<span class='ok'>4. STABILIZE</span>   upgrade shell, set up your loot/notes dir\n<span class='ok'>5. PRIV-ESC</span>    enumerate the host, escalate to root/SYSTEM\n<span class='ok'>6. LOOT+WRITEUP</span> grab proof, document every step as you go\n<span class='am'>RULE</span>          if stuck 30 min, re-enumerate before hinting</div></div><h3>The 30-minute hint rule and the rabbit-hole budget</h3><p>Stuck is where learning happens, but indefinitely stuck is just frustration. Adopt a rule: when blocked, spend 30 minutes re-enumerating and re-reading your own notes <em>before</em> looking at any hint. When you do take a hint, take the <strong>smallest possible nudge</strong>, not the full walkthrough. After solving, read the official write-up to find the path you missed, so you learn the intended technique even when you brute-forced your way through.</p><div class='box tip'><div class='bt'>Tip.</div> Keep a \"techniques I missed\" log. Every time a write-up shows a faster path than yours, add one line. Re-reading this log monthly is the single highest-leverage study habit for the OSCP.</div><h3>Write it up or it did not happen</h3><p>The write-up is not an afterthought, it is the product. A good write-up forces you to actually understand the path, gives you proof of skill for your portfolio (Lesson 5), and rehearses the exact deliverable the OSCP and PNPT exams grade you on. Write up retired HTB machines and your own lab boxes freely; do not publish solutions to active HTB machines, which violates their rules.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>writeup-template.md</span></div><div class='term-body'><span class='cm'># &lt;Box Name&gt; - &lt;difficulty&gt;</span>\n<span class='ok'>## Summary</span>     one paragraph: how root was achieved\n<span class='ok'>## Recon</span>       nmap output, key findings\n<span class='ok'>## Foothold</span>    the vuln, the exploit, the shell (with cmds)\n<span class='ok'>## Priv-esc</span>    enumeration finding -> escalation\n<span class='ok'>## Remediation</span> how a defender would have stopped each step\n<span class='dim'>## Lessons</span>     what I would do faster next time</div></div><div class='box law'><div class='bt'>Law.</div> Platform skill is sandboxed skill. HTB, THM, and PortSwigger give you explicit authorization to attack their targets. That authorization does not transfer anywhere. Do not \"test\" what you learned on a real site, employer, or app without written scope.</div><h3>Building a weekly rhythm</h3><p>Consistency beats binges. A sustainable plan: one guided THM room or PortSwigger topic on a weeknight to learn something new, one unguided HTB box on the weekend to test yourself, and one write-up published per week. Three deliberate sessions a week compounds far faster than one all-night cram a month.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: solve a box end-to-end with the methodology and publish a write-up.</p><ol><li>Pick a retired easy HackTheBox machine (or a VulnHub box in your home lab).</li><li>Run the 6-step methodology above WITHOUT a walkthrough; enforce the 30-minute re-enumerate rule before any hint.</li><li>Take screenshots/command logs at each phase as you go, not after.</li><li>Write it up using the template, including a Remediation section to show defensive understanding.</li><li>Read the official
