 write-up and add at least one entry to your \"techniques I missed\" log.</li><li>Publish the write-up (blog, GitHub, or Markdown repo). This is your first portfolio piece for Lesson 5.</li></ol></div></div>"});
add({"id":"p21-4","part":"21 · Certs & Career","nav":"Resume bullets","num":"21.4","kicker":"Part 21 · Lesson 4","title":"Writing a Resume That Gets Security Interviews","html":"<h3>The resume's only job</h3><p>Your resume does not get you hired; it gets you a 20-minute screen. It has to survive two filters: an automated applicant-tracking system (ATS) scanning for keywords, and a human skimming it for six seconds. Both filters reward the same thing: concrete, scannable evidence that you can do the work. This lesson teaches you to convert the lab, CTF, and write-up work from earlier lessons into resume bullets that beat both filters.</p><h3>The anatomy of a strong bullet</h3><p>Weak bullets describe duties. Strong bullets describe <strong>action plus tool plus measurable result</strong>. Even as a beginner with no paid security job, your lab and CTF work produces real, specific accomplishments you can phrase this way.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>bullet-formula.txt</span></div><div class='term-body'><span class='ok'>[Strong verb] + [what you did] + [tools] + [quantified result]</span>\n\n<span class='bad'>weak:</span>  \"Familiar with penetration testing tools.\"\n<span class='ok'>strong:</span> \"Compromised 25+ HackTheBox machines using\n        Nmap, BloodHound, and manual exploitation;\n        published 12 write-ups documenting full\n        attack chains and remediation.\"\n\n<span class='bad'>weak:</span>  \"Built a home lab.\"\n<span class='ok'>strong:</span> \"Designed an isolated 6-VM Active Directory lab\n        (Windows DC, clients, Kali) to practice Kerberos\n        attacks and lateral movement; documented in a\n        public GitHub repo.\"</div></div><h3>Beating the ATS without keyword-stuffing</h3><p>The ATS matches the words in the job description against the words on your resume. Read the posting, extract its exact terminology, and mirror the terms you genuinely have. If it says \"SIEM\" and you have used Splunk, write both. If it says \"vulnerability assessment\" and you ran Nessus in your lab, use that phrase. Do not lie, and do not stuff a white-text keyword block; modern ATS and recruiters flag it.</p><div class='box tip'><div class='bt'>Tip.</div> Keep one master resume listing everything, then create a tailored copy per application that surfaces the bullets and keywords matching that specific posting. Tailoring beats a generic resume every time and takes ten minutes.</div><h3>What goes on a beginner's one page</h3><p>You have more to show than you think. Order sections by strength, not by tradition. For a career-changer or new grad, projects and certs often outrank work history.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>resume-skeleton.txt</span></div><div class='term-body'><span class='ok'>Header</span>        name, city, email, GitHub, LinkedIn\n<span class='ok'>Summary</span>       2 lines: target role + 1 standout proof\n<span class='ok'>Skills</span>        grouped: recon, exploitation, AD, web, tools\n<span class='ok'>Projects</span>      home lab, top CTF stats, write-ups (links)\n<span class='ok'>Certs</span>         Security+/PNPT/eJPT, in-progress OSCP\n<span class='dim'>Experience</span>    even non-security jobs: show transferable wins\n<span class='dim'>Education</span>     degree or relevant courses\n<span class='am'>LIMIT</span>         one page for entry-level. one.</div></div><h3>Turning transferable experience into security value</h3><p>If you are switching careers, your prior job is an asset, not a liability. Help-desk experience means you understand users and tickets, which SOC teams love. Sysadmin work means you know the systems attackers target. Sales means you can communicate findings to non-technical stakeholders, a genuinely rare skill in security. Translate the old role into the language of the new one.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>translate.txt</span></div><div class='term-body'><span class='dim'>was:</span> \"Answered IT help desk tickets.\"\n<span class='ok'>now:</span> \"Triaged 40+ daily user incidents and access issues,\n      building the troubleshooting and documentation\n      discipline used in SOC alert handling.\"</div></div><div class='box law'><div class='bt'>Law.</div> Never fabricate certs, clearances, or experience. Security employers run background checks and verify certifications directly with the issuer. A discovered lie ends the offer and follows you in a small industry. \"In progress\" is honest; \"holds OSCP\" when you do not is fraud.</div><h3>Common resume killers</h3><ul><li>Two pages for an entry-level role, padded with fluff.</li><li>A \"skills\" bar chart claiming \"Python 90%\" with no project to back it.</li><li>No links. If you mention write-ups or a lab, link them or they did not happen.</li><li>Typos in a field that is literally about attention to detail.</li></ul><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: draft and pressure-test three real resume bullets from your own work.</p><ol><li>Pick one target job posting and highlight its 10 most-repeated keywords.</li><li>Write THREE bullets using the [verb + action + tools + result] formula, drawn from your home lab, your CTF stats, and your write-ups.</li><li>Quantify each one: number of boxes, number of VMs, number of write-ups, hours, or findings.</li><li>Check each bullet against the posting's keywords and revise to mirror its exact terminology where truthful.</li><li>Run the bullets past the \"could a liar write this without doing the work?\" test. If yes, add a specific detail only the doer would know.</li><li>Drop the three bullets into a one-page master resume using the skeleton above.</li></ol></div></div>"});
add({"id":"p21-5","part":"21 · Certs & Career","nav":"Portfolio & first role","num":"21.5","kicker":"Part 21 · Lesson 5","title":"Portfolio & Landing the First Role","html":"<h3>The portfolio is your proof of work</h3><p>In security, a public body of work is the single most persuasive thing you can show an employer, because it proves you do this for real and not just for a test. A candidate with a blog of write-ups, a documented home lab, and a few responsibly-disclosed bugs will out-compete a stack of paper certificates. This final lesson assembles everything from the previous four into a portfolio and turns it into job offers through the realistic on-ramps: bug bounty, internships, and junior pentester or SOC roles.</p><h3>What a portfolio actually contains</h3><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>portfolio.txt</span></div><div class='term-body'><span class='ok'>1. Write-ups</span>     retired-box + lab solutions (from L3)\n<span class='ok'>2. Home lab</span>      topology + what you practice (from L2)\n<span class='ok'>3. Tooling</span>       a small script/tool you wrote, on GitHub\n<span class='ok'>4. Bug bounty</span>    any valid finding, even low severity\n<span class='ok'>5. Notes</span>         a methodology or cheatsheet you maintain\n<span class='am'>vehicle</span>        a simple blog or a GitHub README index</div></div><p>You do not need all five to start applying. Three solid write-ups, a documented lab, and one small tool already put you ahead of most entry-level applicants. The portfolio is a living thing; you keep adding to it while you apply.</p><h3>Building the portfolio page</h3><p>Keep it simple. A GitHub repository with a clean README that links to each write-up is enough, and it doubles as proof you can use Git. If you want a blog, a static-site generator or any free hosting works. The content matters infinitely more than the design. Each entry should state what the project was, what you did, and what it demonstrates.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>README.md (portfolio index)</span></div><div class='term-body'><span class='ok'># Jordan Lee - Security Portfolio</span>\nAspiring junior pentester. OSCP in progress.\n\n<span class='ok'>## Write-ups</span>\n- [HTB: Lame] foothold via vsftpd + priv-esc\n- [Lab: AD Kerberoasting] full chain to Domain Admin\n\n<span class='ok'>## Home Lab</span>\n- 6-VM isolated AD lab (DC, clients, Kali) - topology\n\n<span class='ok'>## Tools</span>\n- portscan-parser.py - nmap XML to markdown report\n\n<span class='ok'>## Disclosures</span>\n- Reflected XSS in &lt;program&gt;, reported + fixed</div></div><h3>The four realistic on-ramps</h3><p>Almost nobody starts as a senior pentester. Pick the door that fits your current strengths and runway.</p><ul><li><strong>Bug bounty:</strong> the most accessible. Platforms give you legal, in-scope targets. Even one accepted low-severity bug is a real, citable accomplishment. Start with programs that welcome beginners and read every scope rule.</li><li><strong>Internships:</strong> structured, mentored, and forgiving of inexperience. Apply broadly; many convert to full-time.</li><li><strong>SOC analyst:</strong> the most common entry point into security. High volume of openings, pairs well with Security+, and teaches you how attacks look from the defender's side, which makes you a better attacker later.</li><li><strong>Junior pentester:</strong> harder to land cold, but a strong portfolio plus PNPT/OSCP makes it reachable. Smaller consultancies hire juniors more readily than big names.</li></ul><div class='box danger'><div class='bt'>Danger.</div> Bug bounty is only legal inside a program's published scope. Testing a company that has no program, or going out-of-scope on one that does, is unauthorized access regardless of your intent. Read the scope, stay inside it, and stop the moment you are unsure.</div><div class='box law'><div class='bt'>Law.</div> Responsible disclosure is a discipline. Report through the official channel, give the vendor reasonable time to fix, and do not publish details or proof-of-concept until they authorize it or the agreed window closes. A premature disclosure can expose users and expose you to liability.</div><h3>The application and networking loop</h3><p>Applications alone are a slow channel. Combine them with visibility: post your write-ups, engage in security communities, attend local meetups or conference villages, and ask people in roles you want for a 15-minute conversation. Most first jobs come through a human who saw your work, not a cold form. When you do interview, expect to walk through one of your write-ups live, so know your own work cold.</p><div class='box tip'><div class='bt'>Tip.</div> Treat rejections as data, not verdicts. Track every application, ask for feedback when you can, and after each interview write down the one question you fumbled and go learn it. The fifth interview is far easier than the first.</div><h3>Putting it all together</h3><p>You now have the full arc: a cert roadmap (L1), a lab to practice in (L2), a deliberate-practice engine producing write-ups (L3), a resume that converts that work into interviews (L4), and a portfolio plus a job-search strategy to land the role (L5). The work is real, public, and yours. Keep shipping write-ups while you apply, and the offer follows the body of evidence.</p><div class='hw'><div class='hw-head'><span class='hwicon'>&#9656;</span><span class='hwt'>Lab</span></div><div class='hw-body'><p>Goal: publish a portfolio index page and take one concrete step toward a first role.</p><ol><li>Create a public GitHub repo named like <code>security-portfolio</code> with a README using the index structure above.</li><li>Link your existing write-ups (from Lesson 3) and a description of your home lab (from Lesson 2).</li><li>Add a short \"About\" line stating your target role and any cert in progress.</li><li>Sign up for one bug-bounty platform, pick a beginner-friendly program, and read its scope end to end.</li><li>Submit at least 5 tailored job applications (SOC, internship, or junior pentest) using the tailored resume from Lesson 4, linking your new portfolio.</li><li>Identify one local meetup or online community and introduce yourself with a link to one write-up.</li></ol></div></div>"});

/* ===== RENDER ENGINE ===== */
const nav=document.getElementById('nav');
const content=document.getElementById('content');
const crumbPath=document.getElementById('crumbPath');
const pfill=document.getElementById('pfill');
const pctTxt=document.getElementById('pctTxt');
const completed=new Set();
let current=0;
let lastPart=null;
L.forEach((les,i)=>{
  if(les.part!==lastPart){
    const lab=document.createElement('span');lab.className='part-label';lab.textContent=les.part;nav.appendChild(lab);lastPart=les.part;
  }
  const b=document.createElement('button');
  b.className='nav-item';b.dataset.i=i;
  b.innerHTML=`<span class="num">${les.num||'»'}</span><span class="ntxt">${les.nav}</span><span class="done">✓</span>`;
  b.addEventListener('click',()=>{go(i);closeSidebar();});
  nav.appendChild(b);
});
function updateNav(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    const i=+el.dataset.i;
    el.classList.toggle('active',i===current);
    el.classList.toggle('completed',completed.has(i));
  });
}
function updateProgress(){
  const total=L.filter(x=>!x.cover).length;
  const doneCount=[...completed].filter(i=>!L[i].cover).length;
  const pct=Math.round(doneCount/total*100);
  pfill.style.width=pct+'%';pctTxt.textContent=pct+'%';
}
function go(i){
  current=i;const les=L[i];
  crumbPath.textContent=les.num?`./module-${les.num}`:'./start';
  let foot=`<div class="lesson-foot">`;
  foot+=i>0?`<button class="btn ghost" onclick="go(${i-1})">← prev</button>`:`<span></span>`;
  if(!les.cover){
    const mark=completed.has(i);
    foot+=`<button class="btn" id="markBtn" onclick="toggleDone(${i})">${mark?'✓ completed — click to undo':'mark lesson complete'}</button>`;
  } else {foot+=`<span></span>`;}
  foot+=i<L.length-1?`<button class="btn primary" onclick="go(${i+1})">next →</button>`:`<span></span>`;
  foot+=`</div>`;
  const head=les.cover?'':`<span class="lesson-kicker">${les.kicker}</span><h2 class="lesson-title">${les.title}</h2>`;
  content.innerHTML=head+les.html+foot;
  window.scrollTo({top:0,behavior:'smooth'});
  updateNav();
}
function toggleDone(i){
  if(completed.has(i))completed.delete(i);else completed.add(i);
  updateProgress();updateNav();
  const btn=document.getElementById('markBtn');
  if(btn)btn.textContent=completed.has(i)?'✓ completed — click to undo':'mark lesson complete';
}
window.go=go;window.toggleDone=toggleDone;
const sidebar=document.getElementById('sidebar');
const scrim=document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click',()=>{sidebar.classList.toggle('open');scrim.classList.toggle('show');});
scrim.addEventListener('click',closeSidebar);
function closeSidebar(){sidebar.classList.remove('open');scrim.classList.remove('show');}
go(0);updateProgress();
</script>
</body>
</html>
