add({id:'p0l1',part:'00 · Orientation',nav:'Ethics, law & rules of engagement',num:'0.1',kicker:'Module 00 · Lesson 1',title:'Ethics, Law & Rules of Engagement',html:`
<p class="lede">Before a single command, you internalize the one idea that defines this entire profession: a penetration test and a crime can be byte-for-byte identical. The only difference is permission.</p>
<h3>White, grey, black</h3>
<ul>
<li><strong>White hat</strong> — works with authorization to improve security. This is the job: pentesters, red teamers, bug-bounty hunters, security engineers.</li>
<li><strong>Black hat</strong> — attacks without permission for gain or harm. This is the crime.</li>
<li><strong>Grey hat</strong> — pokes at systems without permission but without malice. Still illegal, still risky, still not how pros operate.</li>
</ul>
<h3>The five pillars of authorized testing</h3>
<ol>
<li><strong>Authorization</strong> — written, signed, from someone with authority to grant it.</li>
<li><strong>Scope</strong> — exactly which IPs, domains, apps, and accounts are in-bounds.</li>
<li><strong>Rules of Engagement (RoE)</strong> — allowed techniques, testing windows, who to call if something breaks, no-go actions.</li>
<li><strong>Data handling</strong> — how you store, transmit, and destroy anything sensitive.</li>
<li><strong>Responsible disclosure</strong> — report findings to the owner; give them time to fix before going public.</li>
</ol>
<h3>The laws you must know</h3>
<table>
<tr><th>Jurisdiction</th><th>Key law</th><th>Covers</th></tr>
<tr><td>USA</td><td>Computer Fraud &amp; Abuse Act (CFAA)</td><td>Unauthorized access / exceeding authorized access</td></tr>
<tr><td>USA</td><td>DMCA §1201</td><td>Circumventing technical protections</td></tr>
<tr><td>UK</td><td>Computer Misuse Act 1990</td><td>Unauthorized access &amp; modification</td></tr>
<tr><td>EU</td><td>GDPR + Directive 2013/40</td><td>Personal data + attacks on info systems</td></tr>
</table>
<div class="box danger"><div class="bt">Hard rule</div>"I was just learning" is not a legal defense. "I had a signed scope document" is. For every offensive action in this course, your target is your own lab VM or an explicitly-authorized practice range (HackTheBox, TryHackMe, PortSwigger Academy, VulnHub). Never the real internet.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 0.1</span></div><div class="hw-body"><ol>
<li>Write your own one-page <strong>Rules of Engagement template</strong>: scope, allowed techniques, testing window, emergency contact, out-of-scope list. You'll reuse it for every engagement.</li>
<li>Read a real, redacted penetration test report (search "sample penetration test report PDF"). Find where each of the five pillars appears.</li>
<li>Create free accounts on <a href="https://tryhackme.com" target="_blank">TryHackMe</a> and the <a href="https://portswigger.net/web-security" target="_blank">PortSwigger Web Security Academy</a> — your legal playgrounds for the rest of the course.</li>
</ol><span class="stretch">↗ Stretch: summarize the CFAA in plain English in 200 words.</span></div></div>
`});

add({id:'p1l1',part:'01 · Foundations',nav:'Security mindset & the attacker lifecycle',num:'1.1',kicker:'Module 01 · Lesson 1',title:'The Security Mindset & Attacker Lifecycle',html:`
<p class="lede">Hacking isn't typing fast in a dark room. It's a disciplined process. Learn the map of that process now and every later lesson slots into place.</p>
<h3>The CIA triad</h3>
<ul>
<li><strong>Confidentiality</strong> — only authorized parties can read the data.</li>
<li><strong>Integrity</strong> — data hasn't been tampered with.</li>
<li><strong>Availability</strong> — the system is up when needed.</li>
</ul>
<p>Every attack violates at least one. Ransomware breaks availability and confidentiality; a defacement breaks integrity.</p>
<h3>The attacker lifecycle (the Cyber Kill Chain)</h3>
<table>
<tr><th>Phase</th><th>What happens</th><th>Learned in</th></tr>
<tr><td>1 · Recon</td><td>Gather info, passively then actively</td><td>Module 4</td></tr>
<tr><td>2 · Scanning / Enumeration</td><td>Map hosts, ports, services, versions</td><td>Module 4</td></tr>
<tr><td>3 · Gaining access</td><td>Exploit a weakness for a foothold</td><td>Modules 5–6</td></tr>
<tr><td>4 · Privilege escalation</td><td>Low-priv → admin/root</td><td>Module 6</td></tr>
<tr><td>5 · Lateral movement</td><td>Pivot deeper into the network</td><td>Modules 7–8</td></tr>
<tr><td>6 · Reporting</td><td>Attackers hide tracks; <em>you</em> document everything</td><td>Module 17</td></tr>
</table>
<div class="box tip"><div class="bt">The pro framework</div>The industry standard for describing real attacker behavior is <a href="https://attack.mitre.org" target="_blank">MITRE ATT&amp;CK</a> — a matrix of tactics &amp; techniques. Bookmark it; you'll map findings to it for the rest of your career.</div>
<h3>Think in attack surface</h3>
<p>The <strong>attack surface</strong> is every point where an attacker can interact with a system: open ports, web forms, APIs, logins, file uploads, third-party libraries, employees, and now AI endpoints. Mapping it is the attacker's job; shrinking it is the defender's.</p>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 1.1</span></div><div class="hw-body"><ol>
<li>Pick an app you use daily. List its attack surface: every input, login, API, integration. Aim for 15+ items.</li>
<li>For three of those, name which CIA property an attacker targets and why.</li>
<li>Browse the ATT&amp;CK matrix; pick one technique and write two sentences on what it does.</li>
</ol></div></div>
`});

add({id:'p1l2',part:'01 · Foundations',nav:'Build your hacking lab',num:'1.2',kicker:'Module 01 · Lesson 2',title:'Build Your Hacking Lab',html:`
<p class="lede">You need a safe, isolated, legal place to break things: a virtual lab where attacker and victim machines live on a private network on your own computer, touching nothing outside.</p>
<h3>The architecture</h3>
<ul>
<li><strong>Hypervisor</strong> — VirtualBox (free) or VMware. Runs your VMs.</li>
<li><strong>Attacker VM</strong> — Kali Linux (Module 2).</li>
<li><strong>Victim VMs</strong> — deliberately vulnerable: <em>Metasploitable 2/3</em>, <em>OWASP Juice Shop</em>, <em>DVWA</em>, <em>VulnHub</em> boxes.</li>
<li><strong>Host-only / internal network</strong> — the critical bit: set the adapter to <em>Host-Only</em> so vulnerable boxes can never reach (or be reached from) the internet.</li>
</ul>
<div class="box danger"><div class="bt">Why isolation matters</div>Metasploitable is <strong>designed</strong> to be hacked. Bridge it to your real network and you've put a wide-open machine on the internet — and into the rest of your home network. Host-only networking is not optional.</div>
<h3>Cloud-based ranges (zero setup)</h3>
<ul>
<li><a href="https://tryhackme.com" target="_blank">TryHackMe</a> — guided, beginner friendly.</li>
<li><a href="https://hackthebox.com" target="_blank">Hack The Box</a> — closer to real CTFs.</li>
<li><a href="https://portswigger.net/web-security" target="_blank">PortSwigger Academy</a> — the best free web-hacking labs anywhere.</li>
</ul>
<div class="box lab"><div class="bt">Lab 1.2 · Stand up your range</div>Install VirtualBox. Import the Kali and Metasploitable 2 images. Create a Host-Only network. Boot both. From Kali, confirm you can ping Metasploitable and <strong>cannot</strong> reach <code>8.8.8.8</code> on the victim's isolated adapter.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 1.2</span></div><div class="hw-body"><ol>
<li>Build the lab and screenshot Kali pinging Metasploitable.</li>
<li>Take a clean <strong>snapshot</strong> of each VM so you can roll back after breaking things. Document how.</li>
<li>Complete your first TryHackMe room ("Linux Fundamentals" or "Tutorial").</li>
</ol></div></div>
`});

add({id:'p1l3',part:'01 · Foundations',nav:'Linux fundamentals for hackers',num:'1.3',kicker:'Module 01 · Lesson 3',title:'Linux Fundamentals for Hackers',html:`
<p class="lede">Security runs on Linux. If the command line scares you, that ends today. You need fluency in the dozen commands you'll use every day.</p>
<h3>Navigation &amp; searching</h3>
<table>
<tr><th>Command</th><th>Does</th></tr>
<tr><td><code>pwd</code></td><td>where am I</td></tr>
<tr><td><code>ls -la</code></td><td>list files incl. hidden, with permissions</td></tr>
<tr><td><code>cd /etc</code></td><td>change directory</td></tr>
<tr><td><code>cat</code> / <code>less</code></td><td>read a file</td></tr>
<tr><td><code>find / -name "*.conf"</code></td><td>search the filesystem</td></tr>
<tr><td><code>grep -r "password" .</code></td><td>search inside files (a hacker's best friend)</td></tr>
</table>
<h3>Permissions — the heart of privilege</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">kali@kali — permissions</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ ls -l /etc/shadow
<span class="dim">-rw-r-----</span> 1 root shadow 1420 /etc/shadow
<span class="cm"># type(-) owner(rw-) group(r--) other(---)</span>
<span class="cm"># only root can read it — that's why password hashes hide here</span></div></div>
<p><code>chmod</code> changes permissions, <code>chown</code> ownership, <code>sudo</code> runs as root. A misconfigured <code>sudo</code> or a world-writable file is a classic privilege escalation — you'll exploit exactly these in Module 6.</p>
<h3>Networking from the shell</h3>
<ul><li><code>ip a</code> — interfaces &amp; IPs</li><li><code>ping</code> — host alive?</li><li><code>ss -tulpn</code> — what's listening</li><li><code>curl</code> / <code>wget</code> — talk to servers, download files</li></ul>
<div class="box lab"><div class="bt">Lab 1.3 · Encoding is not encryption</div>This proves a beginner trap — Base64 <em>looks</em> scrambled but reverses instantly, so HTTP Basic Auth is effectively plaintext.
<div class="term" style="margin-top:12px"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">live output</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ <span class="cm">echo -n "admin:hunter2" | base64</span>
YWRtaW46aHVudGVyMg==
<span class="pr">kali@kali</span>:~$ <span class="cm">echo -n "YWRtaW46aHVudGVyMg==" | base64 -d</span>
<span class="ok">admin:hunter2</span>
<span class="dim"># lesson: always use TLS. base64 hides nothing.</span></div></div></div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 1.3</span></div><div class="hw-body"><ol>
<li>In Kali, run every command in the tables and note the output.</li>
<li>Use <code>grep -r</code> to find every file under <code>/etc</code> mentioning <code>root</code>.</li>
<li>Run the Base64 lab, then encode/decode a sentence of your own.</li>
<li>Complete TryHackMe "Linux Fundamentals Parts 1 &amp; 2."</li>
</ol><span class="stretch">↗ Stretch: write a one-line bash loop that pings 10 IPs and prints which are up.</span></div></div>
`});

/* ===== 02 KALI ===== */
add({id:'p2l1',part:'02 · Kali Linux',nav:'What Kali is & how it works',num:'2.1',kicker:'Module 02 · Lesson 1',title:'What Kali Linux Is & How It Actually Works',html:`
<p class="lede">Kali is the most famous name in hacking and the most misunderstood. It's not magic and not for daily driving — it's a Debian-based Linux distribution purpose-built and pre-loaded for security testing.</p>
<h3>Under the hood</h3>
<ul>
<li><strong>Debian-based.</strong> Built on Debian Testing — everything you know about <code>apt</code>, <code>.deb</code> packages, and Debian layout applies.</li>
<li><strong>Rolling release.</strong> Continuously updated: <code>sudo apt update &amp;&amp; sudo apt full-upgrade</code> pulls the latest tools and kernel.</li>
<li><strong>Curated tool repo.</strong> Maintained by <strong>OffSec</strong>, Kali packages 600+ tools so you don't compile them by hand. That curation is the value.</li>
<li><strong>Runs anywhere.</strong> Bare metal, VM, WSL2, ARM (Raspberry Pi), live USB, even Android (Kali NetHunter).</li>
</ul>
<h3>How Kali differs from "normal" Linux</h3>
<table>
<tr><th>Trait</th><th>Why</th></tr>
<tr><td>Tools pre-installed</td><td>nmap, Metasploit, Burp, Wireshark, John, hashcat, sqlmap, aircrack-ng ship ready</td></tr>
<tr><td>Default non-root user</td><td>modern Kali runs as user <code>kali</code>; you <code>sudo</code> for privileged tasks</td></tr>
<tr><td>Minimal services</td><td>network services off by default to keep the attack box quiet</td></tr>
<tr><td>Tuned for assessment</td><td>a workshop, not a server — you don't host production on Kali</td></tr>
</table>
<div class="box tip"><div class="bt">When NOT to use Kali</div>It's a specialist tool. For daily browsing, coding, or a server, use Ubuntu/Debian/Fedora and reach for Kali for security work. Alternatives in the same niche: <strong>Parrot Security OS</strong> (lighter, privacy-focused) and <strong>BlackArch</strong> (Arch-based, 2800+ tools, advanced).</div>
<h3>The kali-tweaks helper</h3>
<p>Kali ships a config menu — <code>sudo kali-tweaks</code> — to toggle metapackages, shells, virtualization guest tools, and network settings without editing config files.</p>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 2.1</span></div><div class="hw-body"><ol>
<li>Run <code>cat /etc/os-release</code> and <code>uname -a</code>. Record the Debian base and kernel version.</li>
<li>Run a full upgrade and explain "rolling release" in your own words.</li>
<li>Open <code>sudo kali-tweaks</code> and document three things you can configure.</li>
<li>Write 150 words: "Why is Kali a bad daily-driver OS?"</li>
</ol></div></div>
`});

add({id:'p2l2',part:'02 · Kali Linux',nav:'Driving the Kali toolset',num:'2.2',kicker:'Module 02 · Lesson 2',title:'Driving the Kali Toolset',html:`
<p class="lede">600 tools is overwhelming until you realize they cluster into a handful of categories that map onto the attacker lifecycle. Learn the map, not the menu.</p>
<h3>Kali's tool categories</h3>
<table>
<tr><th>Category</th><th>Star tools</th><th>Lifecycle phase</th></tr>
<tr><td>Information Gathering</td><td>nmap, recon-ng, theHarvester</td><td>Recon</td></tr>
<tr><td>Vulnerability Analysis</td><td>nikto, OpenVAS, sqlmap</td><td>Scanning</td></tr>
<tr><td>Web Application Analysis</td><td>Burp, ZAP, wpscan, gobuster</td><td>Web</td></tr>
<tr><td>Password Attacks</td><td>John, hashcat, hydra</td><td>Access</td></tr>
<tr><td>Exploitation</td><td>Metasploit, searchsploit</td><td>Access</td></tr>
<tr><td>Sniffing &amp; Spoofing</td><td>Wireshark, tcpdump, Bettercap</td><td>All</td></tr>
<tr><td>Wireless</td><td>aircrack-ng, Kismet</td><td>Wireless</td></tr>
<tr><td>Post Exploitation</td><td>Mimikatz, Empire</td><td>Privesc / persist</td></tr>
</table>
<h3>Metapackages: install by role</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">kali@kali — metapackages</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ <span class="cm"># everything-bundle (huge):</span>
<span class="pr">kali@kali</span>:~$ sudo apt install kali-linux-everything
<span class="pr">kali@kali</span>:~$ <span class="cm"># role-based, leaner:</span>
<span class="pr">kali@kali</span>:~$ sudo apt install kali-tools-web kali-tools-wireless
<span class="pr">kali@kali</span>:~$ man nmap   <span class="cm"># always read the manual first</span></div></div>
<div class="box tip"><div class="bt">Read the man page first</div>The single best habit: before running any tool, run <code>man toolname</code> or <code>toolname --help</code>. Knowing what flags exist is the difference between a script kiddie and an operator.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 2.2</span></div><div class="hw-body"><ol>
<li>For each of the 8 categories, open one tool and read its <code>--help</code>.</li>
<li>Map each category to its kill-chain phase. Make a one-page cheat sheet.</li>
<li>Run <code>searchsploit smb</code> and explain what searchsploit/Exploit-DB is.</li>
</ol></div></div>
`});

/* ===== 03 NETWORKING ===== */
add({id:'p3l1',part:'03 · Networking',nav:'TCP/IP, ports & protocols',num:'3.1',kicker:'Module 03 · Lesson 1',title:'TCP/IP, Ports & Protocols',html:`
<p class="lede">You cannot attack what you don't understand. Almost every remote attack rides on the same plumbing: IP addresses, ports, and a handful of protocols. Master the handshake and the rest follows.</p>
<h3>The model, simplified</h3>
<ul>
<li><strong>IP address</strong> — identifies a host (<code>192.168.1.10</code>).</li>
<li><strong>Port</strong> — identifies a service (0–65535). A host is a building; ports are its doors.</li>
<li><strong>TCP</strong> — reliable, connection-oriented, uses a 3-way handshake.</li>
<li><strong>UDP</strong> — fast, fire-and-forget (DNS, VoIP).</li>
</ul>
<h3>The TCP three-way handshake</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">tcp handshake</span></div><div class="term-body">client  ── <span class="am">SYN</span> ──────────▶  server   <span class="dim">"can we talk?"</span>
client  ◀── <span class="am">SYN-ACK</span> ──────  server   <span class="dim">"yes, can you?"</span>
client  ── <span class="am">ACK</span> ──────────▶  server   <span class="ok">"connected."</span>

<span class="cm"># open  → SYN-ACK returns | closed → RST | filtered → silence</span></div></div>
<h3>Ports you'll see constantly</h3>
<table>
<tr><th>Port</th><th>Service</th><th>Why it matters</th></tr>
<tr><td>21</td><td>FTP</td><td>often anonymous / cleartext creds</td></tr>
<tr><td>22</td><td>SSH</td><td>remote admin; brute-force / pivot target</td></tr>
<tr><td>80 / 443</td><td>HTTP / HTTPS</td><td>web attack surface</td></tr>
<tr><td>139 / 445</td><td>SMB</td><td>Windows file sharing; huge attack history</td></tr>
<tr><td>3389</td><td>RDP</td><td>Windows remote desktop</td></tr>
<tr><td>88 / 389 / 636</td><td>Kerberos / LDAP(S)</td><td>Active Directory — Module 8</td></tr>
</table>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 3.1</span></div><div class="hw-body"><ol>
<li>Draw the handshake from memory; add closed and filtered cases.</li>
<li>Memorize the port table. Quiz yourself until you can name all six cold.</li>
<li>Run <code>ss -tulpn</code> on your machine and identify every listening service. Should they all be running?</li>
</ol></div></div>
`});

add({id:'p3l2',part:'03 · Networking',nav:'Packet analysis & sniffing',num:'3.2',kicker:'Module 03 · Lesson 2',title:'Packet Analysis & Sniffing',html:`
<p class="lede">Wireshark turns invisible traffic into something you can read packet by packet — how you prove a protocol leaks secrets and debug every weird thing you'll see.</p>
<h3>The tools</h3>
<ul><li><strong>Wireshark</strong> — GUI analyzer: capture, filter, follow streams.</li><li><strong>tcpdump</strong> — CLI capture, perfect for headless boxes.</li></ul>
<h3>The key skill: display filters</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">wireshark display filters</span></div><div class="term-body"><span class="cm"># only HTTP</span>
http
<span class="cm"># one host</span>
ip.addr == 192.168.1.10
<span class="cm"># only SYN packets (spot scans)</span>
tcp.flags.syn == 1 &amp;&amp; tcp.flags.ack == 0
<span class="cm"># cleartext form posts</span>
http.request.method == "POST"</div></div>
<div class="box danger"><div class="bt">Legal note</div>Sniffing captures everything on the wire, including other people's data. Capture only on networks you own or are authorized to test — unauthorized capture can itself be a wiretap violation.</div>
<div class="box lab"><div class="bt">Lab 3.2 · Catch a cleartext login</div>In your isolated lab, log into DVWA over plain HTTP while Wireshark captures. Filter <code>http.request.method == "POST"</code>, follow the stream, and find your credentials in the clear. This is why HTTPS exists.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 3.2</span></div><div class="hw-body"><ol>
<li>Do Lab 3.2 and screenshot the captured creds (lab only).</li>
<li>Capture a DNS query: <code>sudo tcpdump -i any port 53 -n</code>, then visit a site and read the lookup.</li>
<li>Explain why the same login over HTTPS shows only encrypted gibberish.</li>
</ol></div></div>
`});

/* ===== 04 RECON ===== */
add({id:'p4l1',part:'04 · Recon & Scanning',nav:'Passive recon & OSINT',num:'4.1',kicker:'Module 04 · Lesson 1',title:'Passive Recon & OSINT',html:`
<p class="lede">The best recon never touches the target. Open-Source Intelligence builds a complete picture of an organization from public data alone — where every real engagement begins.</p>
<h3>Passive vs active</h3>
<ul>
<li><strong>Passive</strong> — gather public info without sending traffic to the target (WHOIS, DNS, search engines, social media, breach data, certificate logs).</li>
<li><strong>Active</strong> — interact directly (scanning). Higher signal, higher detection risk. Next lesson.</li>
</ul>
<h3>Core techniques</h3>
<table>
<tr><th>Technique</th><th>Tool / source</th><th>Yields</th></tr>
<tr><td>WHOIS</td><td><code>whois example.com</code></td><td>registrar, sometimes contacts</td></tr>
<tr><td>DNS enum</td><td><code>dig</code>, <code>dnsenum</code></td><td>subdomains, mail servers, IPs</td></tr>
<tr><td>Cert transparency</td><td>crt.sh</td><td>hidden subdomains via SSL certs</td></tr>
<tr><td>Google dorking</td><td><code>site: filetype: inurl:</code></td><td>exposed files, login portals</td></tr>
<tr><td>Email/people</td><td>theHarvester</td><td>employee emails for phishing scope</td></tr>
<tr><td>Breach data</td><td>Have I Been Pwned</td><td>previously-leaked credentials</td></tr>
</table>
<h3>Google dorking examples</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">search operators</span></div><div class="term-body"><span class="cm"># files on a domain</span>
site:example.com filetype:pdf
<span class="cm"># exposed login pages</span>
site:example.com inurl:login
<span class="cm"># accidental directory listings</span>
intitle:"index of" site:example.com</div></div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 4.1</span></div><div class="hw-body"><ol>
<li>Run OSINT on a domain <strong>you own</strong> (or <code>example.com</code>): registrar, DNS records, subdomains via crt.sh, indexed files via dorks.</li>
<li>Check your own email at Have I Been Pwned; note which breaches it appeared in.</li>
<li>Write a one-paragraph OSINT profile as if briefing a client.</li>
</ol><span class="stretch">↗ Stretch: run theHarvester against your own domain.</span></div></div>
`});

add({id:'p4l2',part:'04 · Recon & Scanning',nav:'Active scanning with nmap',num:'4.2',kicker:'Module 04 · Lesson 2',title:'Active Scanning with nmap',html:`
<p class="lede">nmap is the single most important tool in this course. It discovers live hosts, finds open ports, fingerprints services, and runs vulnerability scripts. Learn it deeply.</p>
<h3>Essential commands</h3>
<table>
<tr><th>Command</th><th>Does</th></tr>
<tr><td><code>nmap 192.168.1.0/24 -sn</code></td><td>host discovery — who's alive</td></tr>
<tr><td><code>nmap 192.168.1.10</code></td><td>default scan of 1000 common ports</td></tr>
<tr><td><code>nmap -p- 192.168.1.10</code></td><td>all 65535 ports</td></tr>
<tr><td><code>nmap -sV 192.168.1.10</code></td><td>service + version detection</td></tr>
<tr><td><code>nmap -sV -sC -p- -oN scan.txt &lt;ip&gt;</code></td><td>versions + scripts + save (the workhorse)</td></tr>
<tr><td><code>nmap --script vuln &lt;ip&gt;</code></td><td>run NSE vulnerability scripts</td></tr>
</table>
<h3>How a port scanner actually works</h3>
<p>nmap isn't magic — it opens a socket to each port and watches the handshake. Here's a hand-built scanner doing the essential thing, run live against a box with two services on 8080 and 9001:</p>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">live output — diy port scanner</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ <span class="cm">python3 scanner.py 127.0.0.1</span>
Scanning 127.0.0.1 ports 8075-8085 and 8999-9005...
  <span class="ok">[OPEN]   port 8080</span>
  <span class="ok">[OPEN]   port 9001</span>
Scan complete. Closed ports stay silent; open ports answer the handshake.</div></div>
<p>The whole scanner is ~10 lines: for each port, attempt <code>connect_ex()</code>; a return of <code>0</code> means the handshake completed. nmap adds speed, stealth, OS detection, and 600+ scripts on top.</p>
<div class="box lab"><div class="bt">Lab 4.2 · Map your victim</div>From Kali: <code>nmap -sV -sC -p- -oN metasploitable.txt &lt;ip&gt;</code>. You'll see a dozen+ open ports with versions. Record one exact version string — next module we turn it into a finding.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 4.2</span></div><div class="hw-body"><ol>
<li>Write the 10-line Python scanner yourself; run it against <code>127.0.0.1</code> and match results to <code>ss -tulpn</code>.</li>
<li>Run the full scan against Metasploitable and save to a file.</li>
<li>For each service, note the version and check whether known issues exist.</li>
<li>Read <code>man nmap</code> and explain three flags not in the table.</li>
</ol></div></div>
`});

/* ===== 05 WEB & VULNS ===== */
add({id:'p5l1',part:'05 · Web & Vulns',nav:'Vulnerabilities, CVEs & CVSS',num:'5.1',kicker:'Module 05 · Lesson 1',title:'Vulnerabilities, CVEs & CVSS',html:`
<p class="lede">A scan gives you services and versions. The next step turns "Apache 2.4.49" into "this is exploitable and here's how bad it is." That's the language of CVEs and CVSS.</p>
<h3>The vocabulary</h3>
<ul>
<li><strong>Vulnerability</strong> — an exploitable weakness.</li>
<li><strong>Exploit</strong> — the code/technique that abuses it.</li>
<li><strong>CVE</strong> — a unique ID like <code>CVE-2021-41773</code> for each public flaw.</li>
<li><strong>CVSS</strong> — a 0–10 severity score; 9.0+ is critical.</li>
<li><strong>Zero-day</strong> — a vuln with no patch yet.</li>
</ul>
<h3>Where to research</h3>
<ul>
<li><a href="https://nvd.nist.gov" target="_blank">NVD</a> — authoritative CVE + CVSS.</li>
<li><a href="https://www.exploit-db.com" target="_blank">Exploit-DB</a> — public exploit archive (<code>searchsploit</code> offline in Kali).</li>
<li><a href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog" target="_blank">CISA KEV</a> — what's exploited in the wild right now.</li>
</ul>
<div class="box tip"><div class="bt">Vuln scan ≠ pentest</div>Running a scanner and pasting output is a vulnerability scan, not a pentest. Real value comes from <em>validating</em> each finding, chaining them, and explaining business impact. Tools find; humans judge.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 5.1</span></div><div class="hw-body"><ol>
<li>Take one service version from your scan; look it up on NVD and record CVE(s) and CVSS.</li>
<li>Run <code>searchsploit</code> against it in Kali.</li>
<li>Run <code>nikto -h http://&lt;ip&gt;</code> against Metasploitable; explain three findings.</li>
</ol></div></div>
`});

add({id:'p5l2',part:'05 · Web & Vulns',nav:'Web hacking & the OWASP Top 10',num:'5.2',kicker:'Module 05 · Lesson 2',title:'Web Hacking & the OWASP Top 10',html:`
<p class="lede">The web is where most real attacks happen, because every company has web apps and most have bugs. The OWASP Top 10 is the canonical list of the most common, most damaging web flaws.</p>
<h3>The OWASP Top 10 (2021)</h3>
<table>
<tr><th>#</th><th>Category</th><th>The idea</th></tr>
<tr><td>A01</td><td>Broken Access Control</td><td>change <code>id=1</code> to <code>id=2</code>, see someone else's data</td></tr>
<tr><td>A02</td><td>Cryptographic Failures</td><td>secrets in the clear / weak crypto</td></tr>
<tr><td>A03</td><td>Injection</td><td>untrusted input becomes code — SQLi, command injection, XSS</td></tr>
<tr><td>A04</td><td>Insecure Design</td><td>the flaw is in the blueprint</td></tr>
<tr><td>A05</td><td>Misconfiguration</td><td>default creds, verbose errors, open buckets</td></tr>
<tr><td>A06</td><td>Vulnerable Components</td><td>the outdated library with a known CVE</td></tr>
<tr><td>A07</td><td>Auth Failures</td><td>weak passwords, no rate limiting, broken sessions</td></tr>
<tr><td>A08</td><td>Integrity Failures</td><td>unsigned updates, insecure deserialization</td></tr>
<tr><td>A09</td><td>Logging Failures</td><td>no logs = no detection</td></tr>
<tr><td>A10</td><td>SSRF</td><td>trick the server into making requests for you</td></tr>
</table>
<h3>The two you'll meet first</h3>
<p><strong>SQL Injection</strong> — input concatenated into a query. A login building <code>...WHERE name='$input'</code> is subverted by <code>' OR '1'='1</code>, making the condition always true. Fix: parameterized queries.</p>
<p><strong>Cross-Site Scripting (XSS)</strong> — a site reflects input into a page unsanitized, so an attacker's <code>&lt;script&gt;</code> runs in other users' browsers. Fix: output encoding + Content-Security-Policy.</p>
<div class="box lab"><div class="bt">Lab 5.2 · Your first real web hacks (authorized targets)</div>Use only deliberately-vulnerable apps: <strong>DVWA</strong>, <strong>Juice Shop</strong>, <strong>PortSwigger Academy</strong>. Complete PortSwigger's intro SQL injection and XSS labs — each spins up a fresh authorized target, so everything is legal by design.</div>
<div class="box danger"><div class="bt">Never on real sites</div>Trying these against a site you don't own is a crime, even "just to see." The labs exist precisely so you never have to.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 5.2</span></div><div class="hw-body"><ol>
<li>Complete the PortSwigger intro SQLi and XSS labs; screenshot each solve.</li>
<li>In DVWA (low → medium), exploit the SQLi and reflected-XSS challenges; note how raising security changes what works.</li>
<li>For each bug, write the developer fix (parameterized queries; output encoding + CSP).</li>
<li>Learn one new OWASP category per day this week; one sentence each.</li>
</ol></div></div>
`});

add({id:'p5l3',part:'05 · Web & Vulns',nav:'The Burp Suite workflow',num:'5.3',kicker:'Module 05 · Lesson 3',title:'The Burp Suite Workflow',html:`
<p class="lede">Burp Suite is the web hacker's primary weapon: a proxy that sits between your browser and the target so you can see, intercept, and modify every request.</p>
<h3>How the proxy works</h3>
<p>Point your browser at Burp (<code>127.0.0.1:8080</code>), install Burp's CA cert so HTTPS is readable, and every request pauses in Burp where you edit it before it reaches the server. The whole superpower: <em>nothing the browser sends is trustworthy, and Burp lets you prove it.</em></p>
<h3>The core tabs</h3>
<table>
<tr><th>Tab</th><th>Use</th></tr>
<tr><td><strong>Proxy</strong></td><td>intercept &amp; edit live requests</td></tr>
<tr><td><strong>Repeater</strong></td><td>resend one request with tweaks — the workhorse</td></tr>
<tr><td><strong>Intruder</strong></td><td>automate payloads across a parameter (throttled in free Community)</td></tr>
<tr><td><strong>Target / Site map</strong></td><td>app structure as you browse</td></tr>
<tr><td><strong>Decoder</strong></td><td>Base64 / URL / hex on the fly</td></tr>
</table>
<div class="box tip"><div class="bt">Free is enough</div>Burp Community is free and covers this course. OWASP ZAP is a fully-free open-source alternative.</div>
<div class="box lab"><div class="bt">Lab 5.3 · Intercept and tamper</div>Configure Burp against Juice Shop. Add an item to your cart, intercept in Proxy, send to Repeater, change the quantity/price field, and watch the server's reaction — how you discover access-control and business-logic flaws.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 5.3</span></div><div class="hw-body"><ol>
<li>Set up Burp Community + FoxyProxy and intercept an HTTPS request to Juice Shop.</li>
<li>Use Repeater to modify a parameter; document the response.</li>
<li>Use Decoder to round-trip a Base64 string; connect it back to Lab 1.3.</li>
</ol></div></div>
`});

/* ===== 06 EXPLOITATION ===== */
add({id:'p6l1',part:'06 · Exploitation',nav:'Exploitation & Metasploit basics',num:'6.1',kicker:'Module 06 · Lesson 1',title:'Exploitation & Metasploit Basics',html:`
<p class="lede">This is the phase everyone pictures: turning a known vulnerability into actual access. Done right it's methodical and — critically — done only against your own lab.</p>
<h3>What an exploit framework gives you</h3>
<p>The <strong>Metasploit Framework</strong> is a library of vetted exploits, payloads, and post-exploitation modules with one consistent interface. You select a module, set options, and run — turning "I found CVE-X" into a repeatable, auditable action, which is exactly what a report needs.</p>
<h3>The mental model</h3>
<table>
<tr><th>Concept</th><th>Meaning</th></tr>
<tr><td><strong>Module / exploit</strong></td><td>code that triggers a specific vuln</td></tr>
<tr><td><strong>Payload</strong></td><td>what runs after success (e.g. a Meterpreter shell)</td></tr>
<tr><td><strong>RHOSTS / LHOST</strong></td><td>target IP and your listener IP</td></tr>
<tr><td><strong>Meterpreter</strong></td><td>an in-memory post-exploitation shell</td></tr>
</table>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">msfconsole — against your OWN lab</span></div><div class="term-body"><span class="pr">msf6</span> &gt; search vsftpd
<span class="pr">msf6</span> &gt; use exploit/unix/ftp/vsftpd_234_backdoor
<span class="pr">msf6</span> &gt; set RHOSTS &lt;metasploitable-ip&gt;
<span class="pr">msf6</span> &gt; check
<span class="pr">msf6</span> &gt; run
<span class="ok">[+] session opened</span>   <span class="cm"># a shell on YOUR lab box</span></div></div>
<div class="box danger"><div class="bt">Lab targets only — always</div>Every command targets <strong>Metasploitable or a VulnHub box on your isolated network</strong>. Pointing an exploit at a system you don't own is a serious crime regardless of intent. The skill is repeatability and documentation, not breaking into anything real.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 6.1</span></div><div class="hw-body"><ol>
<li>Use your Lesson 4.2 version data to <code>search</code> a matching module for one Metasploitable service.</li>
<li>Read the module's <code>info</code>; list required options before running.</li>
<li>Get one session, run <code>sysinfo</code> and <code>getuid</code>, document every step.</li>
<li>Roll your VM back to its clean snapshot.</li>
</ol></div></div>
`});

add({id:'p6l2',part:'06 · Exploitation',nav:'Password attacks & cryptography',num:'6.2',kicker:'Module 06 · Lesson 2',title:'Password Attacks & Cryptography',html:`
<p class="lede">Passwords are still the front door. Understanding how they're stored, cracked, and defended is one of the most practical skills in security — and one you practice 100% safely on hashes you create yourself.</p>
<h3>How passwords are stored</h3>
<p>Good systems never store your password — they store a <strong>hash</strong>, a one-way fingerprint. Same input → same hash, but you can't reverse it. Cracking means guessing inputs until a hash matches.</p>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">live output — hashing</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ <span class="cm">echo -n "SuperSecret123" | sha256sum</span>
343fcb40497549085c98ae137c137116a5c2442eb8dc0bf0cac3a3419ce05b9f
<span class="dim"># same input → same hash, every time. one-way.</span></div></div>
<h3>The attacks</h3>
<ul>
<li><strong>Dictionary</strong> — try every word in a wordlist (<code>rockyou.txt</code>, 14M leaked passwords).</li>
<li><strong>Brute force</strong> — try every combination; exhaustive but slow.</li>
<li><strong>Rainbow tables</strong> — precomputed hash→password lookups; defeated by salting.</li>
</ul>
<p>A real dictionary attack, run against a hash we generated ourselves:</p>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">live output — dictionary attack</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ <span class="cm">python3 crack.py   # hash = sha256("dragon99")</span>
<span class="bad">[-] tried 'password' ... no match</span>
<span class="bad">[-] tried '123456'   ... no match</span>
<span class="bad">[-] tried 'letmein'  ... no match</span>
<span class="ok">[+] CRACKED: the password is 'dragon99'</span></div></div>
<h3>Why salting kills these attacks</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">live output — salting</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ <span class="cm">python3 salt.py</span>
Salt:        1db63413cd5e2618
Salted hash: 9e51ccbf81afc26b5daef91ab890697ddc530b36d50c0e6c1f04cdc182505b63
<span class="dim"># unique salt per user → rainbow tables useless,</span>
<span class="dim"># identical passwords no longer share a hash.</span></div></div>
<p>The real tools — <strong>John the Ripper</strong> and <strong>hashcat</strong> (GPU-accelerated) — do exactly what our toy did, millions of times per second.</p>
<div class="box lab"><div class="bt">Lab 6.2 · Crack your own hashes</div>1) Hash a few test passwords with <code>sha256sum</code>. 2) Write the 6-line Python attacker and crack the weak ones. 3) In Kali, run <code>john --format=raw-sha256 hashes.txt</code> and watch the logic happen at scale.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 6.2</span></div><div class="hw-body"><ol>
<li>Build and run the dictionary attacker against hashes you create; add a 4th weak password and crack it.</li>
<li>Implement the salting demo; explain why two users with the same password get different hashes.</li>
<li>Crack a small hash file with John in Kali.</li>
<li>Write the defender's checklist: salting, slow hashes (bcrypt/argon2), rate limiting, MFA, length policy.</li>
</ol></div></div>
`});

add({id:'p6l3',part:'06 · Exploitation',nav:'Privilege escalation',num:'6.3',kicker:'Module 06 · Lesson 3',title:'Privilege Escalation & Post-Exploitation',html:`
<p class="lede">A foothold is rarely the goal. You usually land as a low-priv user and must become root/admin. Privesc is the art of finding the misconfiguration that lets you climb.</p>
<h3>Two flavors</h3>
<ul><li><strong>Vertical</strong> — low-priv → admin/root.</li><li><strong>Horizontal</strong> — move to another same-level user.</li></ul>
<h3>Classic Linux privesc paths</h3>
<table>
<tr><th>Misconfig</th><th>Why it's exploitable</th></tr>
<tr><td>Misconfigured <code>sudo</code></td><td>a user can run a binary as root that spawns a shell</td></tr>
<tr><td>SUID binaries</td><td>run as their owner (often root) regardless of who launches them</td></tr>
<tr><td>Writable cron jobs</td><td>a scheduled root task running a script you can edit</td></tr>
<tr><td>Kernel exploits</td><td>old, unpatched kernel with a known local exploit</td></tr>
<tr><td>Creds in files</td><td>passwords in configs, history, backups</td></tr>
</table>
<h3>Enumeration is the whole game</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">enumeration starters (your lab box)</span></div><div class="term-body"><span class="pr">www-data@victim</span>:$ sudo -l                         <span class="cm"># what can I run as root?</span>
<span class="pr">www-data@victim</span>:$ find / -perm -4000 2&gt;/dev/null   <span class="cm"># SUID binaries</span>
<span class="pr">www-data@victim</span>:$ cat /etc/crontab                 <span class="cm"># scheduled tasks</span>
<span class="pr">www-data@victim</span>:$ uname -a                          <span class="cm"># kernel version</span></div></div>
<p>Tools like <strong>LinPEAS</strong> / <strong>WinPEAS</strong> automate the search, flagging suspicious permissions, SUID files, and creds.</p>
<div class="box tip"><div class="bt">The reference everyone uses</div><a href="https://gtfobins.github.io" target="_blank">GTFOBins</a> catalogs how common Unix binaries can be abused for privesc. When <code>sudo -l</code> shows you can run a binary as root, GTFOBins tells you if that's a way in.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 6.3</span></div><div class="hw-body"><ol>
<li>On a TryHackMe privesc room ("Linux PrivEsc"), run each enumeration command and record output.</li>
<li>Find one SUID binary and look it up on GTFOBins.</li>
<li>Escalate to root with one technique; write the remediation a sysadmin should apply.</li>
</ol></div></div>
`});

/* ===== 07 PIVOTING ===== */
add({id:'p7l1',part:'07 · Pivoting & Tunneling',nav:'Pivoting, tunneling & lateral movement',num:'7.1',kicker:'Module 07 · Lesson 1',title:'Pivoting, Tunneling & Lateral Movement',html:`
<p class="lede">Real networks are segmented. You compromise one exposed host, but the valuable systems sit on internal networks you can't reach directly. Pivoting turns your foothold into a doorway into everything behind it.</p>
<h3>The concept</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">why you pivot</span></div><div class="term-body"><span class="am">[ you ]</span> ──reachable──▶ <span class="ok">[ DMZ web server ]</span> ──only IT can reach──▶ <span class="bad">[ internal DB / AD ]</span>
            <span class="dim">you can't touch the internal net...</span>
            <span class="dim">...so you route YOUR traffic THROUGH the box you own.</span></div></div>
<h3>The techniques, simplest first</h3>
<table>
<tr><th>Technique</th><th>What it does</th></tr>
<tr><td>SSH local forward <code>-L</code></td><td>expose a remote service on your local port</td></tr>
<tr><td>SSH remote forward <code>-R</code></td><td>expose your service on the remote side (get past inbound firewalls)</td></tr>
<tr><td>SSH dynamic forward <code>-D</code> + proxychains</td><td>a SOCKS proxy that tunnels <em>any</em> tool through the pivot</td></tr>
<tr><td>Metasploit <code>autoroute</code> / <code>portfwd</code></td><td>route subnets through a Meterpreter session</td></tr>
<tr><td><strong>chisel</strong> / <strong>ligolo-ng</strong></td><td>modern tunneling when SSH isn't available</td></tr>
</table>
<h3>The classic move: a SOCKS pivot</h3>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">dynamic port forward → scan an internal host</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ ssh -D 9050 user@&lt;pivot-host&gt;     <span class="cm"># open a SOCKS proxy</span>
<span class="pr">kali@kali</span>:~$ <span class="cm"># proxychains routes any tool through it:</span>
<span class="pr">kali@kali</span>:~$ proxychains nmap -sT -Pn 10.10.20.5  <span class="cm"># scan the hidden subnet</span></div></div>
<div class="box tip"><div class="bt">TCP-connect scans only through proxies</div>SOCKS proxies can't carry raw SYN scans, so use <code>nmap -sT -Pn</code> (full-connect) through proxychains. This trips people up constantly.</div>
<div class="box lab"><div class="bt">Lab 7.1 · Pivot to a hidden host</div>Build a two-network lab: Kali ↔ "pivot" VM (two NICs) ↔ an internal-only VM. Compromise (or SSH into) the pivot, open a dynamic forward, and use proxychains + nmap to discover and enumerate the internal box you couldn't reach before.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 7.1</span></div><div class="hw-body"><ol>
<li>Do Lab 7.1 and document the full chain with a network diagram.</li>
<li>Repeat the pivot using <strong>chisel</strong> instead of SSH; note when you'd prefer each.</li>
<li>Complete a TryHackMe/HTB networking-pivot room (e.g. "Wreath").</li>
</ol><span class="stretch">↗ Stretch: set up Metasploit <code>autoroute</code> and scan the internal subnet from within msfconsole.</span></div></div>
`});

/* ===== 08 ACTIVE DIRECTORY ===== */
add({id:'p8l1',part:'08 · Active Directory',nav:'AD fundamentals & enumeration',num:'8.1',kicker:'Module 08 · Lesson 1',title:'Active Directory Fundamentals & Enumeration',html:`
<p class="lede">If you want a pentest job, this module matters more than any other. The overwhelming majority of enterprises run Microsoft Active Directory, and most real-world breaches are AD compromises. Master it and you're employable.</p>
<h3>What Active Directory is</h3>
<p>AD is the identity and access backbone of a Windows network. It centralizes users, computers, and permissions so one login works everywhere.</p>
<table>
<tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Domain</td><td>the administrative boundary grouping objects</td></tr>
<tr><td>Domain Controller (DC)</td><td>the server running AD — the crown jewel</td></tr>
<tr><td>Kerberos</td><td>the ticket-based authentication protocol (port 88)</td></tr>
<tr><td>LDAP</td><td>the directory query protocol (389/636)</td></tr>
<tr><td>NTLM</td><td>legacy challenge-response auth; the source of "pass-the-hash"</td></tr>
<tr><td>GPO</td><td>Group Policy — centralized config (and an attack path)</td></tr>
</table>
<h3>Why AD is so attackable</h3>
<p>AD's strength — everything trusts everything within the domain — is also its weakness. One compromised low-priv user lets you <em>enumerate the entire org</em>: every user, group, computer, and the relationships between them. That map reveals the shortest path to Domain Admin.</p>
<h3>Enumeration tooling</h3>
<table>
<tr><th>Tool</th><th>Use</th></tr>
<tr><td><strong>BloodHound + SharpHound</strong></td><td>graph the domain; literally draws the path to Domain Admin</td></tr>
<tr><td><strong>ldapsearch / windapsearch</strong></td><td>query LDAP for users, groups, computers</td></tr>
<tr><td><strong>NetExec (formerly CrackMapExec)</strong></td><td>swiss-army knife for SMB/LDAP/WinRM across many hosts</td></tr>
<tr><td><strong>enum4linux-ng</strong></td><td>SMB enumeration</td></tr>
</table>
<div class="box lab"><div class="bt">Lab 8.1 · Map a domain</div>Deploy <a href="https://github.com/Orange-Cyberdefense/GOAD" target="_blank">GOAD (Game of Active Directory)</a> or use a TryHackMe AD network. Run SharpHound to collect data, load it into BloodHound, and find the shortest path from a low-priv user to Domain Admin. Seeing the graph is the "aha" moment.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 8.1</span></div><div class="hw-body"><ol>
<li>Build or join an AD lab (GOAD, or TryHackMe "Attacktive Directory").</li>
<li>Enumerate users and groups with NetExec and ldapsearch; document the domain structure.</li>
<li>Generate a BloodHound graph and write down the attack path it reveals.</li>
</ol></div></div>
`});

add({id:'p8l2',part:'08 · Active Directory',nav:'AD attacks & lateral movement',num:'8.2',kicker:'Module 08 · Lesson 2',title:'AD Attacks & Lateral Movement',html:`
<p class="lede">With the map in hand, you walk the path. These are the named attacks every AD pentester knows cold — practiced only in your own lab or an authorized range.</p>
<h3>Credential & ticket attacks</h3>
<table>
<tr><th>Attack</th><th>The idea</th></tr>
<tr><td><strong>Kerberoasting</strong></td><td>request service tickets for accounts with an SPN, crack them offline for the service password</td></tr>
<tr><td><strong>AS-REP Roasting</strong></td><td>accounts with pre-auth disabled hand you a crackable hash for free</td></tr>
<tr><td><strong>Pass-the-Hash (PtH)</strong></td><td>authenticate with an NTLM hash without ever knowing the password</td></tr>
<tr><td><strong>Pass-the-Ticket</strong></td><td>reuse a stolen Kerberos ticket</td></tr>
<tr><td><strong>NTLM relay</strong></td><td>relay captured authentication to another service to act as the victim</td></tr>
<tr><td><strong>Golden / Silver tickets</strong></td><td>forge Kerberos tickets after compromising the krbtgt account (total domain control)</td></tr>
</table>
<h3>The toolkit</h3>
<ul>
<li><strong>Impacket</strong> — Python classes/scripts for SMB, Kerberos, and the attacks above (<code>GetUserSPNs.py</code>, <code>secretsdump.py</code>, <code>psexec.py</code>).</li>
<li><strong>Mimikatz</strong> — extract creds/tickets from Windows memory.</li>
<li><strong>Rubeus</strong> — Kerberos abuse from Windows.</li>
<li><strong>NetExec</strong> — spray creds and move laterally across hosts.</li>
</ul>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">kerberoast → crack offline (your lab)</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ GetUserSPNs.py domain/user:pass -dc-ip 10.10.10.5 -request
<span class="dim">[*] retrieved TGS hash for svc_sql ...</span>
<span class="pr">kali@kali</span>:~$ hashcat -m 13100 spn.hash rockyou.txt   <span class="cm"># crack the service pw</span></div></div>
<div class="box danger"><div class="bt">Lab / authorized only</div>These techniques against a domain you don't own are serious felonies. GOAD, HackTheBox Pro Labs, and TryHackMe AD networks exist so you can practice every one of them legally.</div>
<h3>The defenses (what gets you hired as blue team)</h3>
<p>Strong service-account passwords / gMSA, disabling NTLM where possible, tiered admin model, LAPS for local admin passwords, monitoring for Kerberoasting and DCSync, and Protected Users groups.</p>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 8.2</span></div><div class="hw-body"><ol>
<li>In your AD lab, perform a Kerberoast and crack the ticket offline.</li>
<li>Demonstrate pass-the-hash with NetExec or <code>psexec.py</code> to move to a second host.</li>
<li>Walk the BloodHound path from Lesson 8.1 end-to-end to Domain Admin.</li>
<li>For each attack, write the specific defensive control that stops it.</li>
</ol></div></div>
`});

/* ===== 09 CLOUD ===== */
add({id:'p9l1',part:'09 · Cloud Security',nav:'Cloud fundamentals & IAM',num:'9.1',kicker:'Module 09 · Lesson 1',title:'Cloud Fundamentals & IAM',html:`
<p class="lede">The attack surface has moved to the cloud. Companies run on AWS, Azure, and GCP, and the rules are different: there's no network perimeter to hide behind. In the cloud, <em>identity is the perimeter.</em></p>
<h3>The shared responsibility model</h3>
<p>The provider secures the cloud (hardware, hypervisor, physical); <strong>you</strong> secure what you put in it (your data, configs, access policies). The overwhelming majority of cloud breaches are customer misconfigurations, not provider failures.</p>
<h3>IAM — the heart of cloud security</h3>
<table>
<tr><th>Concept</th><th>Meaning</th></tr>
<tr><td>Identity</td><td>users, groups, roles, service accounts</td></tr>
<tr><td>Policy</td><td>JSON document granting/denying specific actions on resources</td></tr>
<tr><td>Role</td><td>a set of permissions a workload or user can assume</td></tr>
<tr><td>Over-permission</td><td>the #1 cloud risk — a role with <code>*:*</code> when it needed one bucket</td></tr>
</table>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">first thing you run with any AWS key</span></div><div class="term-body"><span class="pr">kali@kali</span>:~$ aws sts get-caller-identity      <span class="cm"># who am I?</span>
<span class="pr">kali@kali</span>:~$ aws iam list-attached-user-policies --user-name X
<span class="dim"># goal: find a permission that lets you escalate to admin</span></div></div>
<div class="box tip"><div class="bt">Audit tools you'll live in</div><strong>ScoutSuite</strong> and <strong>Prowler</strong> audit a whole account for misconfigurations; <strong>Pacu</strong> is the Metasploit of AWS for exploitation testing. All free and open source.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 9.1</span></div><div class="hw-body"><ol>
<li>Spin up a free-tier AWS account (or use a sandbox). Create a user and write a least-privilege IAM policy for a single bucket.</li>
<li>Run Prowler or ScoutSuite against your account and read the top findings.</li>
<li>Explain the shared responsibility model in your own words with one example per side.</li>
</ol></div></div>
`});

add({id:'p9l2',part:'09 · Cloud Security',nav:'Cloud attacks & misconfigurations',num:'9.2',kicker:'Module 09 · Lesson 2',title:'Cloud Attacks & Misconfigurations',html:`
<p class="lede">Cloud breaches follow a small set of recurring patterns. Learn these five and you understand most cloud incidents that ever make the news.</p>
<h3>The greatest hits</h3>
<table>
<tr><th>Attack</th><th>How it works</th></tr>
<tr><td>Public storage buckets</td><td>S3/Blob buckets set world-readable leak data wholesale</td></tr>
<tr><td>Metadata service (SSRF→creds)</td><td>an SSRF tricks a server into reading the cloud metadata endpoint and returns temporary credentials</td></tr>
<tr><td>IAM privilege escalation</td><td>chaining over-permissive policies (e.g. <code>iam:PassRole</code>) up to admin</td></tr>
<tr><td>Exposed secrets</td><td>keys committed to GitHub, in env vars, or in container images</td></tr>
<tr><td>Serverless / function abuse</td><td>over-privileged Lambda/Function roles, event injection</td></tr>
</table>
<h3>The metadata attack, conceptually</h3>
<p>Every cloud VM can query a special internal address for its own identity credentials. If a web app on that VM has an SSRF flaw (OWASP A10, Module 5), an attacker makes the server fetch that endpoint and hands back the VM's cloud keys. This is exactly the chain behind several massive breaches — and why providers added <em>IMDSv2</em> (a session-token requirement) as the fix.</p>
<div class="box lab"><div class="bt">Lab 9.2 · Hack a cloud range (legal)</div>Work through <a href="http://flaws.cloud" target="_blank">flAWS.cloud</a> and <a href="http://flaws2.cloud" target="_blank">flAWS2.cloud</a> — free, browser-based AWS hacking challenges that walk you through bucket exposure, metadata theft, and IAM privesc. Then try <strong>CloudGoat</strong> (deploys deliberately-vulnerable AWS scenarios into your own account).</div>
<div class="box danger"><div class="bt">Only your own accounts &amp; the ranges above</div>Cloud resources belong to someone, and providers log everything. Test only accounts you own or the purpose-built ranges named here.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 9.2</span></div><div class="hw-body"><ol>
<li>Complete flAWS.cloud levels 1–3 and write what misconfiguration each exploited.</li>
<li>Deploy one CloudGoat scenario and solve it; document the privesc chain.</li>
<li>Explain the metadata SSRF chain end-to-end and how IMDSv2 defeats it.</li>
</ol></div></div>
`});

/* ===== 10 BINARY EXPLOITATION & RE ===== */
add({id:'p10l1',part:'10 · Binary Exploitation',nav:'Memory corruption & buffer overflows',num:'10.1',kicker:'Module 10 · Lesson 1',title:'Memory Corruption & Buffer Overflows',html:`
<p class="lede">This is the deep end — understanding how programs fail at the memory level. It's the hardest material in the course and a rite of passage for the OSCP. We'll build intuition with a real, live example.</p>
<h3>Why C is dangerous</h3>
<p>Languages like C let you write past the end of a buffer. When you do, you overwrite adjacent memory — including, on the stack, the <em>return address</em> that tells the CPU where to go next. Control that, and you control the program.</p>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">the stack, simplified</span></div><div class="term-body">┌───────────────┐ high addr
│ return address│ ◀── overwrite THIS and you redirect execution
├───────────────┤
│ saved frame   │
├───────────────┤
│  buf[16]      │ ◀── your input lands here and grows UP
└───────────────┘ low addr</div></div>
<h3>See it fail (live)</h3>
<p>Here's a vulnerable C program that copies input into a 16-byte buffer with no bounds check, compiled with a stack canary, then fed oversized input:</p>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">live output — stack smashing detected</span></div><div class="term-body"><span class="pr">$</span> <span class="cm">./vuln "hello"</span>                     <span class="cm"># fits</span>
buffer is 16 bytes; you passed 5 bytes
copied: hello

<span class="pr">$</span> <span class="cm">./vuln "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"</span>   <span class="cm"># overflow</span>
<span class="bad">*** stack smashing detected ***: terminated</span>
<span class="dim"># the canary caught the corruption and aborted —</span>
<span class="dim"># THAT is the defense. without it, the overflow is exploitable.</span></div></div>
<h3>The modern defenses (and why exploitation is hard now)</h3>
<table>
<tr><th>Defense</th><th>What it does</th></tr>
<tr><td>Stack canaries</td><td>a secret value before the return address; corruption is detected (you just saw it)</td></tr>
<tr><td>ASLR</td><td>randomizes memory addresses so you can't hardcode targets</td></tr>
<tr><td>DEP / NX</td><td>marks the stack non-executable so injected code won't run</td></tr>
<tr><td>(bypass) ROP</td><td>attackers chain existing code snippets ("gadgets") to sidestep NX</td></tr>
</table>
<div class="box lab"><div class="bt">Lab 10.1 · Learn the craft legally</div>This is a study skill, not a copy-paste exploit. Work through <a href="https://ropemporium.com" target="_blank">ROP Emporium</a> and <a href="https://pwn.college" target="_blank">pwn.college</a> — purpose-built binaries you exploit in a sandbox, in <code>gdb</code> (with the <em>pwndbg</em> plugin). Recreate the overflow above yourself and watch the canary trip.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 10.1</span></div><div class="hw-body"><ol>
<li>Write and compile the vulnerable C program; trigger the stack-smash detection yourself.</li>
<li>Recompile with <code>-fno-stack-protector</code> and observe the difference in behavior (in your VM only).</li>
<li>Complete the first two ROP Emporium challenges and explain control of the return address in your own words.</li>
</ol><span class="stretch">↗ Stretch: explain how ASLR + NX together force an attacker toward ROP.</span></div></div>
`});

add({id:'p10l2',part:'10 · Binary Exploitation',nav:'Reverse engineering & malware analysis',num:'10.2',kicker:'Module 10 · Lesson 2',title:'Reverse Engineering & Malware Analysis',html:`
<p class="lede">Reverse engineering is reading a program backward — from compiled binary to understanding. It powers malware analysis, vulnerability research, and CTF binary challenges. Done safely, it's one of the most respected specialties in security.</p>
<h3>Static vs dynamic analysis</h3>
<ul>
<li><strong>Static</strong> — examine the binary without running it: strings, imports, disassembly, decompilation.</li>
<li><strong>Dynamic</strong> — run it in a controlled sandbox and watch behavior: files touched, network calls, registry changes.</li>
</ul>
<h3>The toolkit</h3>
<table>
<tr><th>Tool</th><th>Use</th></tr>
<tr><td><strong>Ghidra</strong></td><td>free NSA-built decompiler — turns assembly back into readable C-ish code</td></tr>
<tr><td><strong>IDA / Binary Ninja</strong></td><td>commercial disassemblers (industry standard)</td></tr>
<tr><td><strong>radare2 / rizin</strong></td><td>open-source CLI reverse-engineering framework</td></tr>
<tr><td><code>strings</code>, <code>objdump</code>, <code>file</code></td><td>quick static triage</td></tr>
<tr><td><strong>x64dbg / gdb</strong></td><td>dynamic debugging</td></tr>
</table>
<div class="box danger"><div class="bt">Malware analysis safety — this matters</div>Live malware is real and will infect you if you're careless. Analyze it only in an <strong>isolated VM with no network</strong> (or a fake-internet setup like INetSim), with snapshots, and never on your host. Better yet, start with safe samples: <em>crackmes</em> and CTF binaries are built for practice and won't bite. Online sandboxes like <a href="https://any.run" target="_blank">ANY.RUN</a> and <strong>Cuckoo</strong> let you detonate samples safely in someone else's lab.</div>
<h3>What you're hunting for</h3>
<p>Indicators of Compromise (IOCs): hardcoded IPs/domains (C2 servers), persistence mechanisms, suspicious API calls, encryption routines, and how the sample spreads. You document these so defenders can detect and block it.</p>
<div class="box lab"><div class="bt">Lab 10.2 · Reverse a benign binary</div>Take a simple program (compile your own, or grab a crackme from <a href="https://crackmes.one" target="_blank">crackmes.one</a>). Run <code>strings</code> and <code>file</code> on it, then open it in Ghidra and find the function that checks the password/flag. No malware required.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 10.2</span></div><div class="hw-body"><ol>
<li>Solve one easy crackme in Ghidra; explain how you found the answer.</li>
<li>Set up an isolated analysis VM (no network, snapshotted) and document your safety setup.</li>
<li>Read one published malware analysis report and list the IOCs the analyst extracted.</li>
</ol></div></div>
`});

/* ===== 11 API SECURITY ===== */
add({id:'p11l1',part:'11 · API Security',nav:'API & modern app security',num:'11.1',kicker:'Module 11 · Lesson 1',title:'API & Modern App Security',html:`
<p class="lede">Modern apps are API-first: the browser is just one client talking to a backend API, and mobile apps, single-page apps, and integrations all hit the same endpoints. APIs are now where the bugs are — and they have their own OWASP Top 10.</p>
<h3>Why APIs are different</h3>
<p>A web page guides you with links and forms. An API has no UI — you have to know the endpoints exist. That changes the game: recon means reading docs, Swagger/OpenAPI specs, mobile-app traffic, and JavaScript, then fuzzing for hidden routes.</p>
<h3>The OWASP API Top 10 (the headline risks)</h3>
<table>
<tr><th>Risk</th><th>The idea</th></tr>
<tr><td><strong>BOLA</strong> (Broken Object Level Auth)</td><td>#1 API risk — request <code>/api/orders/123</code>, change to <code>124</code>, get someone else's order</td></tr>
<tr><td>Broken Authentication</td><td>weak tokens, no expiry, guessable sessions</td></tr>
<tr><td>Broken Object Property Level Auth</td><td>mass-assignment: send extra fields like <code>"isAdmin":true</code></td></tr>
<tr><td>Unrestricted Resource Consumption</td><td>no rate limits → brute force &amp; DoS</td></tr>
<tr><td>Function Level Auth</td><td>calling admin endpoints as a normal user</td></tr>
</table>
<h3>JWTs — the token you'll attack most</h3>
<p>A JSON Web Token is the dominant API auth method. The critical insight: <strong>a JWT is signed, not encrypted</strong> — anyone can read its contents. Here it is decoded live, no secret needed:</p>
<div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">live output — JWT decode</span></div><div class="term-body"><span class="pr">$</span> <span class="cm"># token: eyJhbGci...header.eyJ1c2Vy...payload.signature</span>
Anyone can decode the payload without the secret:
  <span class="ok">{"user":"rob","role":"user"}</span>
<span class="dim"># attacks: 'alg:none', weak HMAC secret, not verifying signature,</span>
<span class="dim"># tampering 'role':'user' → 'admin' on servers that don't verify.</span></div></div>
<div class="box tip"><div class="bt">The tooling</div>Burp Suite (with the JWT Editor extension), Postman for exploring APIs, <strong>ffuf</strong> for fuzzing endpoints, and GraphQL <em>introspection</em> queries to dump an entire GraphQL schema.</div>
<div class="box lab"><div class="bt">Lab 11.1 · Break an API legally</div>Complete PortSwigger Academy's <strong>API testing</strong> and <strong>JWT</strong> labs, then deploy <a href="https://github.com/OWASP/crAPI" target="_blank">crAPI</a> (OWASP's deliberately-vulnerable API) and exploit a BOLA flaw to read another user's data.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 11.1</span></div><div class="hw-body"><ol>
<li>Complete the PortSwigger JWT labs (including an <code>alg:none</code> and a weak-secret crack).</li>
<li>In crAPI, find and exploit a BOLA vulnerability; write the fix (object-level authorization checks).</li>
<li>Use ffuf to discover at least one hidden API endpoint on a lab target.</li>
</ol></div></div>
`});

/* ===== 12 MOBILE / IOT / CONTAINERS ===== */
add({id:'p12l1',part:'12 · Mobile, IoT & Containers',nav:'Mobile & IoT/hardware hacking',num:'12.1',kicker:'Module 12 · Lesson 1',title:'Mobile & IoT / Hardware Hacking',html:`
<p class="lede">Every phone and smart device is a computer with its own attack surface. Mobile and IoT testing are growing specialties precisely because these devices ship fast and secure slowly.</p>
<h3>Mobile attack surface</h3>
<table>
<tr><th>Weakness</th><th>What it looks like</th></tr>
<tr><td>Insecure data storage</td><td>tokens/PII in plaintext on the device</td></tr>
<tr><td>Hardcoded secrets</td><td>API keys baked into the app package</td></tr>
<tr><td>Weak transport security</td><td>no cert pinning → interceptable traffic</td></tr>
<tr><td>Insecure auth/logic</td><td>trusting client-side checks</td></tr>
</table>
<p>The framework to know is <strong>OWASP MASVS / MASTG</strong> (Mobile App Security Verification Standard &amp; Testing Guide).</p>
<h3>The Android toolkit</h3>
<ul>
<li><strong>jadx / apktool</strong> — decompile an APK back to readable code &amp; resources.</li>
<li><strong>MobSF</strong> — automated static + dynamic mobile analysis.</li>
<li><strong>Frida / objection</strong> — dynamic instrumentation: hook and modify a running app (e.g. bypass cert pinning).</li>
<li><strong>Burp</strong> — intercept app traffic via a proxy.</li>
</ul>
<h3>IoT &amp; hardware</h3>
<p>IoT widens the surface to firmware and physical interfaces: extract firmware with <strong>binwalk</strong>, find default creds and hardcoded keys, and on hardware look at <em>UART</em> and <em>JTAG</em> debug ports for a root shell. The reference is the <strong>OWASP IoT Top 10</strong> (weak passwords and insecure update mechanisms lead it).</p>
<div class="box law"><div class="bt">Test your own devices only</div>Decompile apps you own and probe hardware you own. Reverse-engineering some commercial apps may also conflict with their terms of service — stick to your own software and dedicated practice apps.</div>
<div class="box lab"><div class="bt">Lab 12.1 · Crack open an app you own</div>Pull an APK you have rights to (or use OWASP's deliberately-vulnerable <strong>iGoat</strong> / <strong>DIVA</strong> apps), decompile it with jadx, and hunt for hardcoded secrets or insecure storage. Run it through MobSF for an automated report.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 12.1</span></div><div class="hw-body"><ol>
<li>Decompile a vulnerable practice app with jadx and find a hardcoded secret.</li>
<li>Run MobSF on it and summarize the top three findings.</li>
<li>Read the OWASP IoT Top 10 and map each item to a real device you own.</li>
</ol></div></div>
`});

add({id:'p12l2',part:'12 · Mobile, IoT & Containers',nav:'Container & Kubernetes security',num:'12.2',kicker:'Module 12 · Lesson 2',title:'Container & Kubernetes Security',html:`
<p class="lede">Modern infrastructure runs in containers orchestrated by Kubernetes. They add convenience — and a whole new layer of attack surface that traditional security never had to consider. You run a homelab, so this one's hands-on-ready.</p>
<h3>Container risks</h3>
<table>
<tr><th>Risk</th><th>Why it bites</th></tr>
<tr><td>Privileged containers</td><td><code>--privileged</code> erases most isolation → host takeover</td></tr>
<tr><td>Exposed Docker socket</td><td>mounting <code>/var/run/docker.sock</code> = root on the host</td></tr>
<tr><td>Vulnerable base images</td><td>shipping old, CVE-ridden layers</td></tr>
<tr><td>Secrets in images</td><td>keys baked into layers, visible via <code>docker history</code></td></tr>
<tr><td>Container escape</td><td>kernel/runtime bugs that break out to the host</td></tr>
</table>
<h3>Kubernetes attack surface</h3>
<ul>
<li><strong>Exposed API server / kubelet</strong> — unauthenticated access = cluster control.</li>
<li><strong>RBAC misconfig</strong> — over-permissive service accounts.</li>
<li><strong>Secrets</strong> — base64-encoded, not encrypted by default.</li>
<li><strong>Lateral movement</strong> — a compromised pod reaching the cluster and cloud metadata.</li>
</ul>
<div class="box tip"><div class="bt">The tooling</div><strong>Trivy</strong> scans images for vulns &amp; secrets; <strong>kube-hunter</strong> probes a cluster for weaknesses; <strong>kube-bench</strong> checks it against the CIS benchmark; <strong>Falco</strong> does runtime detection.</div>
<div class="box lab"><div class="bt">Lab 12.2 · Scan and probe</div>Scan a public image with <code>trivy image nginx:1.18</code> and read the CVEs. Then deploy <strong>kubernetes-goat</strong> (a deliberately-vulnerable cluster) and work through a container-escape and a secrets-exposure scenario.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 12.2</span></div><div class="hw-body"><ol>
<li>Run Trivy on three images you use in your homelab; note the worst CVE in each and how you'd remediate it.</li>
<li>Deploy kubernetes-goat and complete two scenarios; document each attack &amp; defense.</li>
<li>Explain why mounting the Docker socket into a container is equivalent to giving root on the host.</li>
</ol></div></div>
`});

add({id:'p12l3',part:'12 · Mobile, IoT & Containers',nav:'OT, ICS & SCADA security',num:'12.3',kicker:'Module 12 · Lesson 3',title:'OT / ICS / SCADA Security',html:`
<p class="lede">Beyond IT lies <strong>OT</strong> — operational technology: the computers that run power grids, water plants, factories, and pipelines. It's a specialized, high-stakes, well-paid corner of the field where a bug doesn't leak data — it can stop a turbine. Tread carefully.</p>
<h3>The vocabulary</h3>
<table>
<tr><th>Term</th><th>Meaning</th></tr>
<tr><td>ICS</td><td>Industrial Control System — the umbrella for control hardware/software</td></tr>
<tr><td>SCADA</td><td>Supervisory Control &amp; Data Acquisition — monitors/controls plants from a central HMI</td></tr>
<tr><td>PLC</td><td>Programmable Logic Controller — the rugged little computer driving a physical process</td></tr>
<tr><td>HMI</td><td>Human-Machine Interface — the operator's screen</td></tr>
<tr><td>Purdue Model</td><td>the reference network segmentation model (levels 0–5) for OT</td></tr>
</table>
<h3>Why OT is uniquely fragile</h3>
<ul>
<li><strong>Availability over everything.</strong> The CIA triad inverts: a plant that must never stop can't simply be patched or rebooted, so decades-old, unpatched systems are normal.</li>
<li><strong>Insecure-by-design protocols.</strong> Modbus, DNP3, S7, and EtherNet/IP were built for trusted serial links — most have no authentication or encryption at all.</li>
<li><strong>Fragile devices.</strong> A loud Nmap scan can crash a PLC. Aggressive testing that's routine in IT can physically damage equipment or endanger people.</li>
<li><strong>IT/OT convergence.</strong> Once-isolated plants are now networked, dragging IT threats into physical processes (Stuxnet, the Ukraine grid attacks, the Oldsmar water incident).</li>
</ul>
<div class="box danger"><div class="bt">Never test production OT</div>Scanning or exploiting a live industrial system can stop critical infrastructure and hurt people — and is a serious crime. <strong>All practice happens in a simulator or your own lab</strong>: tools like <em>Conpot</em> (an ICS honeypot), <em>GRFICS</em> (a virtual chemical-plant range), <em>OpenPLC</em>, and the <em>ICSim</em> car-CAN simulator. Real engagements use passive monitoring and explicit, change-controlled authorization.</div>
<h3>The toolkit</h3>
<p>Recon: <strong>Shodan</strong>/<strong>Censys</strong> (find internet-exposed ICS — for awareness, not attack), <code>nmap</code> with ICS NSE scripts (gently). Protocols: the <strong>Modbus</strong> tooling in <em>pymodbus</em>, <strong>plcscan</strong>, and Metasploit's SCADA modules. Defense/standards: <strong>IEC 62443</strong> (the OT security standard), the <strong>Purdue Model</strong> for segmentation, and OT-aware monitoring (Nozomi, Claroty, Dragos).</p>
<div class="box lab"><div class="bt">Lab 12.3 · Talk to a PLC (safely)</div>Stand up <strong>OpenPLC</strong> (or the <strong>GRFICS</strong> virtual plant) in your lab. From Kali, use <code>pymodbus</code> to read and then write a Modbus coil/register and watch the simulated process react. You just changed a "physical" output with an unauthenticated protocol — the whole OT security problem in one command.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 12.3</span></div><div class="hw-body"><ol>
<li>Run the OpenPLC or GRFICS simulator and complete Lab 12.3; document how Modbus let you change state with no authentication.</li>
<li>Draw the Purdue Model (levels 0–5) and place a PLC, HMI, historian, and corporate workstation on it.</li>
<li>Read one ICS incident case study (Stuxnet, Ukraine 2015/2016, or Oldsmar). Summarize the attack path and the segmentation/monitoring control that would have caught it.</li>
</ol><span class="stretch">↗ Stretch: explore Shodan's ICS category to understand how many control systems sit exposed — then write why responsible researchers never touch them.</span></div></div>
`});

/* ===== 13 WIRELESS & SE ===== */
add({id:'p13l1',part:'13 · Wireless & Social Eng.',nav:'Wireless security',num:'13.1',kicker:'Module 13 · Lesson 1',title:'Wireless Security',html:`
<p class="lede">Wi-Fi extends the attack surface into the air around a building. Understanding how wireless authentication works — and how it fails — is a distinct, valuable skill.</p>
<h3>The protocols, oldest to current</h3>
<table>
<tr><th>Standard</th><th>Status</th></tr>
<tr><td>WEP</td><td>broken, trivially crackable, never use</td></tr>
<tr><td>WPA / WPA2-PSK</td><td>common; vulnerable to handshake capture + offline cracking of weak passphrases</td></tr>
<tr><td>WPA3</td><td>current; resists offline cracking via the SAE handshake</td></tr>
</table>
<h3>The conceptual attack on WPA2-PSK</h3>
<p>The attacker captures the 4-way handshake that occurs when a device joins, then runs an <em>offline</em> dictionary attack against it — the same idea as Lesson 6.2, just with a Wi-Fi handshake instead of a stolen hash. A strong, long passphrase defeats it; a weak one falls fast. The standard toolkit is <strong>aircrack-ng</strong>.</p>
<div class="box danger"><div class="bt">This one has sharp legal edges</div>Capturing or attacking any wireless network you don't own is illegal in most places, even passively. Practice only on <strong>your own access point</strong> (ideally a cheap dedicated test router) with an adapter that supports monitor mode. When unsure, use TryHackMe's wireless rooms instead of real radios.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 13.1</span></div><div class="hw-body"><ol>
<li>Write up the WPA2 4-way handshake and explain why the attack is "offline."</li>
<li>Explain how WPA3's SAE handshake removes the offline-cracking weakness.</li>
<li>On your <strong>own</strong> router (or a TryHackMe room), document the steps to capture a handshake.</li>
</ol></div></div>
`});

add({id:'p13l2',part:'13 · Wireless & Social Eng.',nav:'Social engineering & phishing',num:'13.2',kicker:'Module 13 · Lesson 2',title:'Social Engineering & Phishing',html:`
<p class="lede">The most reliable way past a firewall is to ask a human to open the door. Social engineering exploits people, not code — and understanding it makes you both a better tester and a much harder target.</p>
<h3>The principles attackers abuse</h3>
<ul>
<li><strong>Authority</strong> — "This is IT, we need your password to fix your account."</li>
<li><strong>Urgency</strong> — "Your account locks in 10 minutes."</li>
<li><strong>Trust / familiarity</strong> — spoofing a colleague or vendor.</li>
<li><strong>Reciprocity &amp; curiosity</strong> — a "free" gift, or a USB drive left in a lobby.</li>
</ul>
<h3>Common vectors</h3>
<table>
<tr><th>Vector</th><th>Description</th></tr>
<tr><td>Phishing</td><td>mass deceptive emails to harvest creds or drop malware</td></tr>
<tr><td>Spear phishing</td><td>targeted, researched, personalized — far more effective</td></tr>
<tr><td>Vishing / Smishing</td><td>phone / SMS variants</td></tr>
<tr><td>Pretexting</td><td>an invented scenario to extract info</td></tr>
<tr><td>Tailgating</td><td>following someone through a secure door</td></tr>
</table>
<div class="box law"><div class="bt">Authorized phishing only</div>Professional phishing simulations are explicitly scoped, target only the client's own employees, and are coordinated with leadership. Sending deceptive emails to people outside an authorized engagement is fraud. This lesson is about recognizing and defending — the offensive side is strictly contract-bound.</div>
<div class="hw"><div class="hw-head"><span class="hwicon">⌗</span><span class="hwt">Homework 13.2</span></div><div class="hw-body"><ol>
<li>Collect 3 real phishing emails from your spam folder. For each, identify the psychological principle and red flags.</li>
<li>Write a one-page "how to spot a phish" guide for a non-technical relative.</li>
<li>Research one famous social-engineering breach; summarize how it worked and how it could've been prevented.</li>
</ol></div></div>
`});

/* ===== 14 SCRIPTING ===== */
